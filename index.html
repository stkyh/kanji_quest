<title>かんじクエスト - 漢字バトル</title>
<style>
  :root {
    --frame: #2b2b3a;
    --panel: #f5f5e8;
    --ink: #2b2b3a;
    --hp-green: #5cd65c;
    --hp-yellow: #f7d038;
    --hp-red: #ff5252;
    --accent: #ff6b9d;
    --gold: #ffb300;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overscroll-behavior: none; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(160deg, #6db3f2, #1e69de);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; font-family: inherit; }
  .game {
    width: 100%;
    max-width: 470px;
    background: var(--frame);
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  h1 {
    color: #fff; text-align: center; font-size: 22px;
    margin-bottom: 10px; letter-spacing: 2px; text-shadow: 2px 2px 0 #000;
  }
  .coinhud {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,.25); color: var(--gold);
    font-weight: bold; font-size: 15px; padding: 4px 12px; border-radius: 20px;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  .menu-card { background: var(--panel); border-radius: 12px; padding: 16px; text-align: center; }
  .menu-card p { margin-bottom: 12px; font-size: 14px; line-height: 1.6; }
  .section-title { font-size: 13px; font-weight: bold; color: #555; margin: 14px 0 6px; }
  .grade-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grade-btn {
    background: #fff; border: 3px solid var(--frame); border-radius: 10px;
    padding: 12px 8px; font-size: 16px; font-weight: bold; cursor: pointer;
    transition: transform .08s, background .15s;
  }
  .grade-btn:active { transform: scale(.95); background: #fff4c2; }
  .grade-btn small { display: block; font-size: 11px; font-weight: normal; color: #666; margin-top: 4px; }

  .mode-row { display: flex; gap: 8px; }
  .mode-btn {
    flex: 1; background: #fff; border: 3px solid var(--frame); border-radius: 10px;
    padding: 10px 6px; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  .mode-btn small { display:block; font-size: 10px; font-weight: normal; color:#666; margin-top:3px; }
  .mode-btn.sel { background: var(--accent); color: #fff; }
  .mode-btn.sel small { color: #ffe3ee; }

  .shop-open-btn {
    display:block; width:100%; margin-top:16px;
    background: var(--gold); color:#5a3d00; border:3px solid var(--frame);
    border-radius:10px; padding:12px; font-size:16px; font-weight:bold; cursor:pointer;
  }
  .shop-open-btn:active { transform: scale(.97); }

  .field {
    position: relative;
    background: linear-gradient(#bfe9ff 60%, #9be08a 60%);
    border: 4px solid var(--frame); border-radius: 12px;
    height: 210px; overflow: hidden; margin-bottom: 8px;
  }
  .enemy-zone { position: absolute; top: 12px; right: 16px; text-align: center; }
  .enemy-sprite { font-size: 76px; line-height: 1; filter: drop-shadow(2px 4px 2px rgba(0,0,0,.3)); transition: transform .1s; }
  .player-zone { position: absolute; bottom: 8px; left: 16px; text-align: center; }
  .player-sprite { font-size: 54px; line-height: 1; }

  .statusbox {
    background: var(--panel); border: 3px solid var(--frame); border-radius: 8px;
    padding: 6px 10px; display: inline-block; min-width: 150px; text-align: left;
  }
  .statusbox .name { font-size: 13px; font-weight: bold; }
  .statusbox .lv { font-size: 11px; color: #555; }
  .hpbar-bg { background: #555; border-radius: 5px; height: 9px; margin-top: 4px; overflow: hidden; }
  .hpbar { height: 100%; background: var(--hp-green); width: 100%; transition: width .4s ease, background .4s; }
  .hp-text { font-size: 10px; text-align: right; }
  .enemy-status { position: absolute; top: 14px; left: 14px; }
  .player-status { position: absolute; bottom: 14px; right: 14px; }

  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .shake { animation: shake .3s; }
  @keyframes flash { 0%,100%{opacity:1} 50%{opacity:.2} }
  .flash { animation: flash .3s 2; }
  @keyframes pop { 0%{transform:scale(0)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .pop { animation: pop .4s; }

  .dmg-float { position: absolute; font-weight: bold; font-size: 26px; color: #ff3030; text-shadow: 1px 1px 0 #fff; pointer-events: none; animation: floatUp 1s forwards; }
  .coin-float { position: absolute; font-weight: bold; font-size: 20px; color: var(--gold); text-shadow: 1px 1px 0 #000; pointer-events: none; animation: floatUp 1.1s forwards; }
  @keyframes floatUp { 0%{opacity:1; transform:translateY(0)} 100%{opacity:0; transform:translateY(-40px)} }

  .panel { background: var(--panel); border: 4px solid var(--frame); border-radius: 12px; padding: 12px; min-height: 158px; }
  .message { font-size: 15px; line-height: 1.5; min-height: 22px; margin-bottom: 6px; }
  .qtag { display:inline-block; font-size:11px; font-weight:bold; color:#fff; background:var(--frame); border-radius:12px; padding:2px 10px; margin-bottom:2px; }
  .quiz-main { font-size: 50px; text-align: center; font-weight: bold; margin: 2px 0 4px; letter-spacing: 4px; }
  .quiz-main.reading { font-size: 30px; letter-spacing: 1px; }
  .quiz-hint { font-size: 13px; text-align: center; color: #666; margin-bottom: 10px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice {
    background: #fff; border: 3px solid var(--frame); border-radius: 8px;
    padding: 13px 6px; font-size: 18px; font-weight: bold; cursor: pointer;
    transition: transform .06s, background .15s;
  }
  .choice:active:not(:disabled) { transform: scale(.96); background: #fff4c2; }
  .choice:disabled { cursor: default; opacity: .9; }
  .choice.correct { background: var(--hp-green); color: #fff; border-color: #2a8a2a; }
  .choice.wrong { background: var(--hp-red); color: #fff; border-color: #a02020; }

  .big-btn {
    display: block; width: 100%; background: var(--accent); color: #fff;
    border: 3px solid var(--frame); border-radius: 10px; padding: 14px;
    font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 8px;
  }
  .big-btn:active { transform: scale(.97); }
  .big-btn.ghost { background:#fff; color:var(--frame); }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap:8px; }
  .badge { background: rgba(255,255,255,.2); color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 20px; }
  .link-btn { background: none; border: none; color: #cdd9ff; font-size: 12px; cursor: pointer; text-decoration: underline; }

  .result-card { background: var(--panel); border-radius: 12px; padding: 22px; text-align: center; }
  .result-card .emoji { font-size: 64px; }
  .result-card h2 { margin: 8px 0; }
  .result-card .stats { font-size: 14px; line-height: 1.8; margin: 12px 0; }
  .reward { color:#a06b00; font-weight:bold; }

  .shop-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .shop-head h2 { color:#fff; font-size:18px; }
  .shop-tabs { display:flex; gap:8px; margin-bottom:10px; }
  .shop-tab { flex:1; background:#fff; border:3px solid var(--frame); border-radius:10px; padding:8px; font-weight:bold; cursor:pointer; font-size:14px; }
  .shop-tab.sel { background:var(--accent); color:#fff; }
  .shop-list { display:flex; flex-direction:column; gap:8px; max-height:50vh; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:2px; }
  .shop-item { background:var(--panel); border:3px solid var(--frame); border-radius:10px; padding:10px; display:flex; align-items:center; gap:10px; }
  .shop-item .ic { font-size:38px; line-height:1; width:46px; text-align:center; }
  .shop-item .info { flex:1; }
  .shop-item .info .nm { font-weight:bold; font-size:15px; }
  .shop-item .info .ds { font-size:12px; color:#555; }
  .shop-item .buy { background:var(--gold); color:#5a3d00; border:2px solid var(--frame); border-radius:8px; padding:8px 10px; font-weight:bold; cursor:pointer; font-size:13px; min-width:80px; }
  .shop-item .buy:disabled { background:#cfcfc0; color:#888; cursor:default; }
  .shop-item .buy.equip { background:#7ec8ff; color:#0a3a5a; }
  .shop-item .buy.equipped { background:#5cd65c; color:#fff; }
  .shop-foot { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
</style>
</head>
<body>
<div class="game">
  <h1>⚔️ かんじクエスト ⚔️</h1>

  <!-- ===== TITLE ===== -->
  <div id="screen-title" class="screen active">
    <div class="topbar">
      <span class="coinhud">🪙 <span id="titleCoins">0</span></span>
      <span class="badge" id="titleAvatar">🦸</span>
    </div>
    <div class="menu-card">
      <p>漢字の問題にこたえて<br>モンスターをやっつけよう！</p>

      <div class="section-title">むずかしさ</div>
      <div class="mode-row">
        <button class="mode-btn sel" data-mode="easy">やさしい<small>よみ だけ</small></button>
        <button class="mode-btn" data-mode="hard">むずかしい<small>音読み・訓読み・画数・ぎゃくびき</small></button>
      </div>

      <div class="section-title">がくねんをえらんでスタート</div>
      <div class="grade-btns" id="gradeBtns"></div>

      <button class="shop-open-btn" id="toShopBtn">🛒 ショップへ</button>
    </div>
  </div>

  <!-- ===== BATTLE ===== -->
  <div id="screen-battle" class="screen">
    <div class="topbar">
      <span class="badge" id="stageBadge">ステージ 1</span>
      <span class="coinhud">🪙 <span id="battleCoins">0</span></span>
      <button class="link-btn" id="quitBtn">やめる</button>
    </div>

    <div class="field" id="field">
      <div class="enemy-zone"><div class="enemy-sprite" id="enemySprite">👾</div></div>
      <div class="enemy-status statusbox">
        <div class="name" id="enemyName">モンスター</div>
        <div class="hpbar-bg"><div class="hpbar" id="enemyHp"></div></div>
      </div>
      <div class="player-zone"><div class="player-sprite" id="playerSprite">🦸</div></div>
      <div class="player-status statusbox">
        <div class="name">じぶん <span class="lv" id="playerLvl"></span></div>
        <div class="hpbar-bg"><div class="hpbar" id="playerHp"></div></div>
        <div class="hp-text" id="playerHpText"></div>
      </div>
    </div>

    <div class="panel">
      <div class="message" id="message"></div>
      <div id="quizArea">
        <div style="text-align:center"><span class="qtag" id="qtag">よみ</span></div>
        <div class="quiz-main" id="quizMain"></div>
        <div class="quiz-hint" id="quizHint"></div>
        <div class="choices" id="choices"></div>
      </div>
      <button class="big-btn" id="nextBtn" style="display:none;">つぎへ ▶</button>
    </div>
  </div>

  <!-- ===== RESULT ===== -->
  <div id="screen-result" class="screen">
    <div class="result-card">
      <div class="emoji" id="resultEmoji">🎉</div>
      <h2 id="resultTitle"></h2>
      <div class="stats" id="resultStats"></div>
      <button class="big-btn" id="backBtn">タイトルへもどる</button>
    </div>
  </div>

  <!-- ===== SHOP ===== -->
  <div id="screen-shop" class="screen">
    <div class="shop-head">
      <h2>🛒 ショップ</h2>
      <span class="coinhud">🪙 <span id="shopCoins">0</span></span>
    </div>
    <div class="shop-tabs">
      <button class="shop-tab sel" data-tab="avatar">👕 みため</button>
      <button class="shop-tab" data-tab="item">💪 のうりょく</button>
    </div>
    <div class="shop-list" id="shopList"></div>
    <div class="shop-foot">
      <button class="link-btn" id="resetBtn">セーブをリセット</button>
      <button class="big-btn ghost" id="shopBackBtn" style="width:auto; margin:0; padding:8px 18px;">もどる</button>
    </div>
  </div>
</div>

/* =========================================================

   ========================================================= */
const SAVE_KEY = "kanjiQuestSave_v2";
let save = loadSave();
function defaultSave() { return { coins: 0, owned: ["hero"], equipped: "hero", items: { hp: 0, atk: 0 } }; }
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    return Object.assign(defaultSave(), JSON.parse(raw));
  } catch (e) { return defaultSave(); }
}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
  refreshCoinHud();
}
function refreshCoinHud() {
  $("titleCoins").textContent = save.coins;
  $("battleCoins").textContent = save.coins;
  $("shopCoins").textContent = save.coins;
  $("titleAvatar").textContent = getAvatar().sprite;
}
function getAvatar() { return AVATARS.find(a => a.id === save.equipped) || AVATARS[0]; }
function baseMaxHp() { return 5 + (save.items.hp || 0) + getAvatar().hp; }
function baseAtk()   { return 1 + (save.items.atk || 0) + getAvatar().atk; }

const $ = id => document.getElementById(id);

function show(name) { Object.values(screens).forEach(s => s.classList.remove("active")); screens[name].classList.add("active"); }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function startGame(grade) {
  state.grade = grade;
  state.stage = 0;
  state.playerMaxHp = baseMaxHp();
  state.playerHp = state.playerMaxHp;
  state.atk = baseAtk();
  state.pool = shuffle(KANJI_DATA[grade]);
  state.poolIdx = 0;
  state.correct = 0;
  state.total = 0;
  state.earned = 0;
  $("playerSprite").textContent = getAvatar().sprite;
  $("playerLvl").textContent = "(" + GRADE_LABELS[grade][0] + " / こうげき" + state.atk + ")";
  show("battle");
  loadStage();
}

function loadStage() {
  const m = MONSTERS[state.stage];
  state.enemyMaxHp = m.hp;
  state.enemyHp = m.hp;
  $("enemyName").textContent = m.name;
  $("enemySprite").textContent = m.sprite;
  $("enemySprite").classList.add("pop");
  setTimeout(() => $("enemySprite").classList.remove("pop"), 400);
  $("stageBadge").textContent = `ステージ ${state.stage + 1} / ${MONSTERS.length}`;
  updateBars();
  setMessage(`あ！ やせいの ${m.name} が あらわれた！`);
  setTimeout(nextQuestion, 900);
}

function updateBars() {
  const ep = Math.max(0, state.enemyHp / state.enemyMaxHp) * 100;
  const pp = Math.max(0, state.playerHp / state.playerMaxHp) * 100;
  const eb = $("enemyHp"), pb = $("playerHp");
  eb.style.width = ep + "%"; pb.style.width = pp + "%";
  eb.style.background = hpColor(ep); pb.style.background = hpColor(pp);
  $("playerHpText").textContent = `HP ${Math.max(0, state.playerHp)}/${state.playerMaxHp}`;
}
function hpColor(pct) { if (pct > 50) return "var(--hp-green)"; if (pct > 20) return "var(--hp-yellow)"; return "var(--hp-red)"; }
function setMessage(t) { $("message").textContent = t; }

/* =========================================================
   出題（よみ / 音読み / 訓読み / 画数 / ぎゃくびき）
   ========================================================= */
function nextEntry() {
  if (state.poolIdx >= state.pool.length) { state.pool = shuffle(state.pool); state.poolIdx = 0; }
  return state.pool[state.poolIdx++];
}

/* 同じ学年の他の漢字から、指定フィールドの読みをあつめて選択肢の候補に */
function distractReadings(field, answer) {
  const set = [...new Set(state.pool.map(e => e[field]).filter(r => r && r !== answer))];
  return shuffle(set).slice(0, 3);
}

function buildReadingQ(entry, field, hint, tag) {
  const answer = entry[field];
  const options = shuffle([answer, ...distractReadings(field, answer)]);
  return { tag, prompt: entry.k, hint, answer, options, mainClass: "" };
}
function buildStrokeQ(entry) {
  const answer = entry.s + "画";
  const set = new Set([entry.s]);
  const deltas = shuffle([-3, -2, -1, 1, 2, 3, 4]);
  let i = 0;
  while (set.size < 4 && i < deltas.length) { const v = entry.s + deltas[i++]; if (v >= 1) set.add(v); }
  let extra = entry.s + 5;
  while (set.size < 4) set.add(extra++);
  const options = shuffle([...set]).map(n => n + "画");
  return { tag: "画数（書きじゅん）", prompt: entry.k, hint: "なん画で書くかな？", answer, options, mainClass: "" };
}
function buildKanjiQ(entry) {
  const reading = entry.kun || entry.on;
  const others = shuffle(state.pool.filter(e => e.k !== entry.k)).slice(0, 3).map(e => e.k);
  return { tag: "ぎゃくびき", prompt: reading, hint: "この よみの かんじは どれ？", answer: entry.k, options: shuffle([entry.k, ...others]), mainClass: "reading" };
}

function makeQuestion(entry) {
  if (state.mode === "easy") {
    const field = entry.kun ? "kun" : "on";
    return buildReadingQ(entry, field, "ただしい よみを えらんでね", "よみ");
  }
  // むずかしいモード：その漢字で出せる種類からランダム
  const cands = [];
  if (entry.kun) cands.push("kun");
  if (entry.on)  cands.push("on");
  cands.push("strokes", "kanji");
  switch (pickOne(cands)) {
    case "kun":     return buildReadingQ(entry, "kun", "「くんよみ（日本のよみ方）」はどれ？", "訓読み");
    case "on":      return buildReadingQ(entry, "on", "「音読み（中国ふうのよみ方）」はどれ？", "音読み");
    case "strokes": return buildStrokeQ(entry);
    default:        return buildKanjiQ(entry);
  }
}

function nextQuestion() {
  state.locked = false;
  const q = makeQuestion(nextEntry());

  setMessage("クイズ！ こたえをえらんでね");
  $("qtag").textContent = q.tag;
  $("quizMain").className = "quiz-main " + q.mainClass;
  $("quizMain").textContent = q.prompt;
  $("quizHint").textContent = q.hint;

  const box = $("choices");
  box.innerHTML = "";
  q.options.forEach(opt => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = opt;
    b.onclick = () => answerChosen(b, opt === q.answer, q.answer);
    box.appendChild(b);
  });
  $("quizArea").style.display = "block";
  $("nextBtn").style.display = "none";
}

function answerChosen(btn, isCorrect, answer) {
  if (state.locked) return;
  state.locked = true;
  state.total++;

  document.querySelectorAll(".choice").forEach(c => {
    c.disabled = true;
    if (c.textContent === answer) c.classList.add("correct");
  });

  if (isCorrect) {
    state.correct++;
    const dmg = state.atk;
    state.enemyHp -= dmg;
    addCoins(5);
    setMessage(`せいかい！ ${dmg} のダメージ！ 💥（🪙+5）`);
    attackAnim("enemy");
    floatDamage("enemy", dmg);
    floatCoin();
  } else {
    btn.classList.add("wrong");
    state.playerHp--;
    setMessage(`ざんねん…！ こたえは「${answer}」。 はんげきをうけた！`);
    attackAnim("player");
    floatDamage("player", 1);
  }
  updateBars();

  setTimeout(() => {
    if (state.enemyHp <= 0) { stageClear(); return; }
    if (state.playerHp <= 0) { gameOver(); return; }
    $("quizArea").style.display = "none";
    $("nextBtn").style.display = "block";
  }, 750);
}
$("nextBtn").onclick = nextQuestion;
function addCoins(n) { save.coins += n; state.earned += n; persist(); }

/* =========================================================
   アニメーション
   ========================================================= */
function attackAnim(target) {
  const sprite = target === "enemy" ? $("enemySprite") : $("playerSprite");
  sprite.classList.add(target === "enemy" ? "shake" : "flash");
  setTimeout(() => sprite.classList.remove("shake", "flash"), 400);
}
function floatDamage(target, text) {
  const d = document.createElement("div");
  d.className = "dmg-float";
  d.textContent = text;
  if (target === "enemy") { d.style.right = "40px"; d.style.top = "30px"; }
  else { d.style.left = "40px"; d.style.bottom = "60px"; }
  $("field").appendChild(d);
  setTimeout(() => d.remove(), 1000);
}
function floatCoin() {
  const d = document.createElement("div");
  d.className = "coin-float";
  d.textContent = "🪙+5";
  d.style.right = "30px"; d.style.top = "70px";
  $("field").appendChild(d);
  setTimeout(() => d.remove(), 1100);
}

/* =========================================================
   ステージクリア / ゲームオーバー / クリア
   ========================================================= */
function stageClear() {
  const m = MONSTERS[state.stage];
  addCoins(25);
  setMessage(`${m.name} を たおした！ 🎊（🪙+25）`);
  $("enemySprite").textContent = "💨";
  $("quizArea").style.display = "none";
  $("nextBtn").style.display = "none";
  state.stage++;
  if (state.stage >= MONSTERS.length) { setTimeout(gameClear, 1100); }
  else { state.playerHp = Math.min(state.playerMaxHp, state.playerHp + 1); updateBars(); setTimeout(loadStage, 1300); }
}
function gameOver() { showResult("💀", "ゲームオーバー…", false); }
function gameClear() { addCoins(100); showResult("👑", "ぜんステージ クリア！", true); }
function showResult(emoji, title, win) {
  $("resultEmoji").textContent = emoji;
  $("resultTitle").textContent = title;
  const rate = state.total ? Math.round(state.correct / state.total * 100) : 0;
  $("resultStats").innerHTML =
    `がくねん：${GRADE_LABELS[state.grade][0]}<br>` +
    `たおしたモンスター：${state.stage} / ${MONSTERS.length}<br>` +
    `せいかい：${state.correct} / ${state.total} もん（${rate}％）<br>` +
    `<span class="reward">このゲームで 🪙${state.earned} ゲット！</span>` +
    (win ? "<br>🌟 ショップで つよくなろう！" : "");
  show("result");
}

/* =========================================================
   ショップ
   ========================================================= */
let shopTab = "avatar";
function openShop() { setShopTab("avatar"); show("shop"); }
function setShopTab(tab) {
  shopTab = tab;
  document.querySelectorAll(".shop-tab").forEach(t => t.classList.toggle("sel", t.dataset.tab === tab));
  renderShop();
}
function renderShop() {
  refreshCoinHud();
  const list = $("shopList");
  list.innerHTML = "";
  if (shopTab === "avatar") AVATARS.forEach(a => list.appendChild(renderAvatarRow(a)));
  else SHOP_ITEMS.forEach(it => list.appendChild(renderItemRow(it)));
}
function renderAvatarRow(a) {
  const owned = save.owned.includes(a.id);
  const equipped = save.equipped === a.id;
  const row = document.createElement("div");
  row.className = "shop-item";
  row.innerHTML = `<div class="ic">${a.sprite}</div><div class="info"><div class="nm">${a.name}</div><div class="ds">${a.desc}</div></div>`;
  const btn = document.createElement("button");
  btn.className = "buy";
  if (equipped) { btn.textContent = "そうび中"; btn.classList.add("equipped"); btn.disabled = true; }
  else if (owned) { btn.textContent = "そうびする"; btn.classList.add("equip"); btn.onclick = () => { save.equipped = a.id; persist(); renderShop(); }; }
  else {
    btn.textContent = `🪙${a.cost}`;
    if (save.coins < a.cost) btn.disabled = true;
    btn.onclick = () => { if (save.coins < a.cost) return; save.coins -= a.cost; save.owned.push(a.id); save.equipped = a.id; persist(); renderShop(); };
  }
  row.appendChild(btn);
  return row;
}
function itemPrice(it) { return it.base + it.growth * (save.items[it.id] || 0); }
function renderItemRow(it) {
  const count = save.items[it.id] || 0;
  const price = itemPrice(it);
  const maxed = count >= it.max;
  const row = document.createElement("div");
  row.className = "shop-item";
  row.innerHTML = `<div class="ic">${it.icon}</div><div class="info"><div class="nm">${it.name}（Lv${count}/${it.max}）</div><div class="ds">${it.desc}</div></div>`;
  const btn = document.createElement("button");
  btn.className = "buy";
  if (maxed) { btn.textContent = "MAX"; btn.disabled = true; }
  else {
    btn.textContent = `🪙${price}`;
    if (save.coins < price) btn.disabled = true;
    btn.onclick = () => { if (save.coins < price || count >= it.max) return; save.coins -= price; save.items[it.id] = count + 1; persist(); renderShop(); };
  }
  row.appendChild(btn);
  return row;
}

/* =========================================================
   ボタン配線・初期化
   ========================================================= */
$("quitBtn").onclick = () => { if (confirm("タイトルにもどる？")) show("title"); };
$("backBtn").onclick = () => { refreshCoinHud(); show("title"); };
$("toShopBtn").onclick = openShop;
$("shopBackBtn").onclick = () => show("title");
document.querySelectorAll(".shop-tab").forEach(t => t.onclick = () => setShopTab(t.dataset.tab));
$("resetBtn").onclick = () => { if (confirm("コインや買ったものを ぜんぶ消して さいしょから にしますか？")) { save = defaultSave(); persist(); renderShop(); } };

buildGradeButtons();
refreshCoinHud();
</script>
