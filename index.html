<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="かんじクエスト">
<meta name="mobile-web-app-capable" content="yes">
<!-- ===== LINEなどでURLを共有したときのプレビュー（OGP） =====
     公開したら下の og:url を「公開URL」に書きかえると確実です。 -->
<meta property="og:type" content="website">
<meta property="og:title" content="かんじクエスト ⚔️ 漢字バトルゲーム">
<meta property="og:description" content="漢字バトルでモンスターをやっつけよう！小学1〜6年の よみ・音読み・訓読み・画数クイズ。コインを貯めて主人公を強化＆必殺技をおぼえよう！">
<meta property="og:site_name" content="かんじクエスト">
<!-- <meta property="og:url" content="https://あなたの公開URL"> -->
<title>かんじクエスト - 漢字バトル</title>
<!-- design: modern glass UI v3 / 技は手動発動・キャラ演出強化ずみ / 読みは学校の代表読み -->
<style>
  :root {
    --ink:#1f2438; --muted:#6b7280;
    --accent1:#7c3aed; --accent2:#ec4899;
    --gold:#fbbf24; --gold2:#f97316;
    --good1:#34d399; --good2:#10b981;
    --bad1:#fb7185; --bad2:#ef4444;
    --card:rgba(255,255,255,.96);
    --grad-primary:linear-gradient(135deg,#7c3aed,#ec4899);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { overscroll-behavior:none; }
  body {
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
    background:
      radial-gradient(1100px 700px at 12% -10%, #5b3aa6 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 10%, #2563eb 0%, transparent 50%),
      radial-gradient(900px 900px at 50% 120%, #db2777 0%, transparent 55%),
      linear-gradient(160deg,#171a3a,#0f1226);
    background-attachment:fixed;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  button { font-family:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }

  .game {
    width:100%; max-width:480px;
    background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.18);
    border-radius:28px;
    padding:16px;
    box-shadow:0 30px 70px rgba(5,8,25,.55), inset 0 1px 0 rgba(255,255,255,.25);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  }
  .brand { text-align:center; margin-bottom:12px; }
  h1 {
    font-size:25px; font-weight:800; letter-spacing:1px;
    background:linear-gradient(90deg,#fde68a,#fca5e7,#a5b4fc);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));
  }
  .brand small { color:rgba(255,255,255,.6); font-size:11px; letter-spacing:2px; }

  .coinhud { display:inline-flex; align-items:center; gap:6px; background:rgba(8,10,25,.45); color:var(--gold); font-weight:800; font-size:15px; padding:6px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.14); }
  .badge { background:rgba(8,10,25,.4); color:#fff; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.14); }
  .badge.avatar { font-size:18px; padding:4px 10px; }
  .link-btn { background:none; border:none; color:rgba(255,255,255,.7); font-size:12px; cursor:pointer; text-decoration:underline; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; }

  .screen { display:none; animation:fade .25s ease; }
  .screen.active { display:block; }
  @keyframes fade { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }

  .card { background:var(--card); border-radius:20px; padding:18px; box-shadow:0 12px 30px rgba(8,10,30,.35); border:1px solid rgba(255,255,255,.6); }
  .menu-card { text-align:center; }
  .menu-card p { margin-bottom:6px; font-size:14px; line-height:1.7; color:#374151; }
  .section-title { font-size:12px; font-weight:800; color:var(--muted); margin:16px 0 8px; letter-spacing:.5px; }

  /* segmented control */
  .seg { display:flex; gap:4px; background:#eef0f6; border-radius:14px; padding:4px; }
  .seg button { flex:1; border:none; background:transparent; border-radius:11px; padding:9px 6px; font-size:13px; font-weight:700; color:#6b7280; cursor:pointer; line-height:1.3; transition:.18s; }
  .seg button small { display:block; font-size:9.5px; font-weight:600; opacity:.8; margin-top:2px; }
  .seg button.sel { background:#fff; color:var(--accent1); box-shadow:0 4px 12px rgba(124,58,237,.18); }

  .grade-btns { display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; }
  .grade-btn { background:#fff; border:1.5px solid #e7e8f0; border-radius:16px; padding:12px 4px; font-size:15px; font-weight:800; color:var(--ink); cursor:pointer; transition:.16s; box-shadow:0 3px 10px rgba(8,10,30,.07); }
  .grade-btn:active { transform:scale(.94); }
  .grade-btn:hover { border-color:var(--accent2); box-shadow:0 8px 18px rgba(236,72,153,.22); transform:translateY(-2px); }
  .grade-btn small { display:block; font-size:10px; font-weight:600; color:var(--muted); margin-top:3px; }

  .btn-primary { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:none; border-radius:16px; padding:15px; font-size:16px; font-weight:800; color:#fff; cursor:pointer; background:var(--grad-primary); box-shadow:0 10px 24px rgba(124,58,237,.35); transition:.16s; }
  .btn-primary:active { transform:scale(.97); }
  .btn-gold { background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#3a2400; box-shadow:0 10px 24px rgba(249,115,22,.32); }
  .btn-ghost { background:#fff; color:var(--accent1); border:1.5px solid #e7e8f0; box-shadow:none; }
  .mt { margin-top:16px; }

  /* ===== battle field ===== */
  .field {
    position:relative; height:216px; overflow:hidden; margin-bottom:10px;
    border-radius:20px; border:1px solid rgba(255,255,255,.5);
    background:
      radial-gradient(120% 80% at 50% 120%, rgba(0,0,0,.12), transparent 60%),
      linear-gradient(#cdeafe 0%, #bfe3ff 56%, #93d68a 56%, #79c46e 100%);
    box-shadow:inset 0 2px 14px rgba(255,255,255,.5), 0 12px 30px rgba(8,10,30,.35);
  }
  .field::after { content:""; position:absolute; inset:0; background:radial-gradient(120% 90% at 50% 30%, transparent 55%, rgba(10,12,40,.18)); pointer-events:none; }

  .sprite-wrap { position:absolute; display:flex; flex-direction:column; align-items:center; z-index:2; }
  .enemy-wrap { top:18px; right:26px; }
  .player-wrap { bottom:14px; left:26px; }
  .sprite-glow { position:absolute; top:46%; left:50%; transform:translate(-50%,-50%); width:108px; height:108px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 68%); }
  .player-wrap .sprite-glow { width:84px; height:84px; }
  .enemy-sprite { font-size:78px; line-height:1; position:relative; z-index:1; filter:drop-shadow(0 8px 7px rgba(0,0,0,.32)); animation:bob 2.6s ease-in-out infinite; }
  .player-sprite { font-size:56px; line-height:1; position:relative; z-index:1; filter:drop-shadow(0 7px 6px rgba(0,0,0,.32)); animation:bob 2.6s ease-in-out infinite .4s; }
  .ground-shadow { width:64px; height:13px; border-radius:50%; background:rgba(10,20,10,.28); filter:blur(4px); margin-top:-2px; }
  .player-wrap .ground-shadow { width:50px; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  .nameplate { position:absolute; z-index:3; background:rgba(255,255,255,.92); border-radius:13px; padding:7px 11px; min-width:150px; box-shadow:0 6px 16px rgba(8,10,30,.25); border:1px solid rgba(255,255,255,.7); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  .nameplate.enemy { top:14px; left:14px; }
  .nameplate.player { bottom:14px; right:14px; }
  .nameplate .name { font-size:13px; font-weight:800; }
  .nameplate .lv { font-size:10px; color:var(--muted); font-weight:600; }
  .hpbar-bg { background:#e5e7ef; border-radius:999px; height:9px; margin-top:5px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.15); }
  .hpbar { height:100%; width:100%; border-radius:999px; background:linear-gradient(90deg,var(--good1),var(--good2)); transition:width .45s cubic-bezier(.4,1.2,.5,1), background .4s; }
  .hp-text { font-size:10px; text-align:right; color:var(--muted); font-weight:700; margin-top:1px; }

  /* anim helpers (defined AFTER sprite rules so they override bob) */
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translate(-9px,2px) rotate(-4deg)} 60%{transform:translate(9px,-2px) rotate(4deg)} }
  .shake { animation:shake .32s !important; }
  @keyframes flash { 0%,100%{opacity:1} 50%{opacity:.25} }
  .flash { animation:flash .3s 2 !important; }
  @keyframes pop { 0%{transform:scale(0)} 60%{transform:scale(1.25)} 100%{transform:scale(1)} }
  .pop { animation:pop .4s !important; }

  .dmg-float { position:absolute; font-weight:900; font-size:28px; color:#fff; text-shadow:0 2px 0 #b91c1c, 0 0 10px rgba(255,0,80,.6); pointer-events:none; animation:floatUp 1s forwards; z-index:7; }
  .dmg-float.big { font-size:44px; text-shadow:0 3px 0 #be123c, 0 0 16px rgba(255,0,90,.8); }
  .coin-float { position:absolute; font-weight:800; font-size:19px; color:var(--gold); text-shadow:0 2px 4px rgba(0,0,0,.5); pointer-events:none; animation:floatUp 1.1s forwards; z-index:7; }
  @keyframes floatUp { 0%{opacity:1; transform:translateY(0) scale(.8)} 25%{transform:translateY(-6px) scale(1.1)} 100%{opacity:0; transform:translateY(-44px) scale(1)} }

  .skill-flash { position:absolute; inset:0; z-index:4; opacity:0; pointer-events:none; mix-blend-mode:screen; }
  @keyframes flashFx { 0%{opacity:0} 30%{opacity:.6} 100%{opacity:0} }
  .skill-proj { position:absolute; font-size:44px; z-index:5; filter:drop-shadow(0 0 10px rgba(255,255,255,.9)); }
  @keyframes skillFly { 0%{left:46px; top:150px; transform:scale(.6) rotate(0)} 100%{left:330px; top:44px; transform:scale(1.5) rotate(360deg)} }
  @keyframes skillStrike { 0%{left:330px; top:-48px; transform:scale(.6); opacity:0} 35%{opacity:1} 100%{left:340px; top:42px; transform:scale(1.7); opacity:1} }
  .skill-burst { position:absolute; left:312px; top:14px; font-size:66px; z-index:6; animation:burstPop .6s forwards; }
  @keyframes burstPop { 0%{transform:scale(0); opacity:1} 55%{transform:scale(1.7)} 100%{transform:scale(2.3); opacity:0} }

  /* ===== gauge + skill button ===== */
  .skillbar { display:flex; align-items:center; gap:10px; background:rgba(8,10,25,.4); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:8px 12px; margin-bottom:10px; }
  .gauge-wrap { display:flex; flex-direction:column; gap:4px; }
  .gauge-label { font-size:10px; font-weight:700; color:rgba(255,255,255,.7); }
  .pips { display:flex; gap:5px; }
  .pip { width:15px; height:15px; border-radius:50%; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25); transition:.2s; }
  .pip.on { background:linear-gradient(135deg,var(--gold),var(--gold2)); border-color:transparent; box-shadow:0 0 9px rgba(251,191,36,.85); }
  .skill-btn { margin-left:auto; display:flex; align-items:center; gap:7px; border:none; border-radius:13px; padding:10px 14px; font-size:14px; font-weight:800; cursor:pointer; color:rgba(255,255,255,.55); background:rgba(255,255,255,.1); transition:.18s; max-width:62%; }
  .skill-btn .ic { font-size:18px; }
  .skill-btn .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .skill-btn:disabled { cursor:default; }
  .skill-btn.ready { color:#3a2400; background:linear-gradient(135deg,var(--gold),var(--gold2)); animation:pulse 1.25s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(251,191,36,.55)} 70%{box-shadow:0 0 0 12px rgba(251,191,36,0)} 100%{box-shadow:0 0 0 0 rgba(251,191,36,0)} }

  /* ===== quiz panel ===== */
  .panel { background:var(--card); border-radius:20px; padding:16px; min-height:172px; box-shadow:0 12px 30px rgba(8,10,30,.35); border:1px solid rgba(255,255,255,.6); }
  .message { font-size:14.5px; line-height:1.5; min-height:21px; margin-bottom:8px; color:#374151; font-weight:600; }
  .qtag { display:inline-block; font-size:11px; font-weight:800; color:#fff; background:var(--grad-primary); border-radius:999px; padding:3px 12px; margin-bottom:2px; }
  .quiz-main { font-size:54px; text-align:center; font-weight:800; margin:4px 0 6px; letter-spacing:4px; color:var(--ink); }
  .quiz-main.reading { font-size:32px; letter-spacing:1px; }
  .quiz-hint { font-size:13px; text-align:center; color:var(--muted); margin-bottom:12px; }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .choice { background:#fff; border:1.5px solid #e7e8f0; border-radius:14px; padding:14px 6px; font-size:18px; font-weight:800; color:var(--ink); cursor:pointer; transition:.14s; box-shadow:0 3px 9px rgba(8,10,30,.07); }
  .choice:active:not(:disabled) { transform:scale(.96); }
  .choice:hover:not(:disabled) { border-color:var(--accent2); transform:translateY(-2px); }
  .choice:disabled { cursor:default; }
  .choice.correct { background:linear-gradient(135deg,var(--good1),var(--good2)); color:#fff; border-color:transparent; box-shadow:0 8px 18px rgba(16,185,129,.35); }
  .choice.wrong { background:linear-gradient(135deg,var(--bad1),var(--bad2)); color:#fff; border-color:transparent; box-shadow:0 8px 18px rgba(239,68,68,.35); }

  .result-card { text-align:center; }
  .result-card .emoji { font-size:66px; filter:drop-shadow(0 8px 10px rgba(0,0,0,.2)); }
  .result-card h2 { margin:8px 0; font-size:22px; }
  .result-card .stats { font-size:14px; line-height:1.9; margin:12px 0; color:#374151; }
  .reward { color:#b45309; font-weight:800; }

  /* ===== shop ===== */
  .shop-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .shop-head h2 { color:#fff; font-size:19px; }
  .shop-tabs { display:flex; gap:6px; margin-bottom:10px; background:rgba(8,10,25,.35); border-radius:14px; padding:4px; }
  .shop-tab { flex:1; background:transparent; border:none; border-radius:11px; padding:9px 4px; font-weight:800; cursor:pointer; font-size:13px; color:rgba(255,255,255,.7); transition:.16s; }
  .shop-tab.sel { background:#fff; color:var(--accent1); box-shadow:0 4px 12px rgba(0,0,0,.2); }
  .shop-note { font-size:11.5px; color:rgba(255,255,255,.75); margin-bottom:10px; line-height:1.5; }
  .shop-list { display:flex; flex-direction:column; gap:9px; max-height:50vh; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:2px; }
  .shop-item { background:var(--card); border-radius:15px; padding:11px; display:flex; align-items:center; gap:11px; box-shadow:0 6px 16px rgba(8,10,30,.22); border:1px solid rgba(255,255,255,.6); }
  .shop-item .ic { font-size:34px; line-height:1; width:48px; height:48px; display:grid; place-items:center; border-radius:12px; background:linear-gradient(135deg,#f3f4ff,#fde9f5); flex:none; }
  .shop-item .info { flex:1; min-width:0; }
  .shop-item .info .nm { font-weight:800; font-size:15px; }
  .shop-item .info .ds { font-size:12px; color:var(--muted); }
  .shop-item .buy { border:none; border-radius:11px; padding:9px 12px; font-weight:800; cursor:pointer; font-size:13px; min-width:84px; color:#3a2400; background:linear-gradient(135deg,var(--gold),var(--gold2)); box-shadow:0 5px 12px rgba(249,115,22,.3); flex:none; }
  .shop-item .buy:disabled { background:#e5e7ef; color:#9aa0ad; box-shadow:none; cursor:default; }
  .shop-item .buy.equip { background:linear-gradient(135deg,#60a5fa,#3b82f6); color:#fff; box-shadow:0 5px 12px rgba(59,130,246,.3); }
  .shop-item .buy.equipped { background:linear-gradient(135deg,var(--good1),var(--good2)); color:#fff; }
  .shop-foot { display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
</style>
</head>
<body>
<div class="game">
  <div class="brand">
    <h1>かんじクエスト</h1>
    <small>KANJI QUEST</small>
  </div>

  <!-- ===== TITLE ===== -->
  <div id="screen-title" class="screen active">
    <div class="topbar">
      <span class="coinhud">🪙 <span id="titleCoins">0</span></span>
      <span class="badge avatar" id="titleAvatar">🦸</span>
    </div>
    <div class="card menu-card">
      <p>漢字の問題にこたえて<br>モンスターをやっつけよう！</p>
      <div class="section-title">むずかしさ</div>
      <div class="seg" id="modeSeg">
        <button class="sel" data-mode="easy">やさしい<small>よみ だけ</small></button>
        <button data-mode="hard">むずかしい<small>音・訓・画数・ぎゃくびき</small></button>
      </div>
      <div class="section-title">がくねんをえらんでスタート</div>
      <div class="grade-btns" id="gradeBtns"></div>
      <button class="btn-primary btn-gold mt" id="toShopBtn">🛒 ショップへ</button>
    </div>
  </div>

  <!-- ===== BATTLE ===== -->
  <div id="screen-battle" class="screen">
    <div class="topbar">
      <span class="badge" id="stageBadge">ステージ 1</span>
      <span class="coinhud">🪙 <span id="battleCoins">0</span></span>
      <button class="link-btn" id="quitBtn">やめる</button>
    </div>

    <div class="field" id="field">
      <div class="nameplate enemy">
        <div class="name" id="enemyName">モンスター</div>
        <div class="hpbar-bg"><div class="hpbar" id="enemyHp"></div></div>
      </div>
      <div class="sprite-wrap enemy-wrap">
        <div class="sprite-glow"></div>
        <div class="enemy-sprite" id="enemySprite">👾</div>
        <div class="ground-shadow"></div>
      </div>

      <div class="sprite-wrap player-wrap">
        <div class="sprite-glow"></div>
        <div class="player-sprite" id="playerSprite">🦸</div>
        <div class="ground-shadow"></div>
      </div>
      <div class="nameplate player">
        <div class="name">じぶん <span class="lv" id="playerLvl"></span></div>
        <div class="hpbar-bg"><div class="hpbar" id="playerHp"></div></div>
        <div class="hp-text" id="playerHpText"></div>
      </div>
    </div>

    <div class="skillbar">
      <div class="gauge-wrap">
        <span class="gauge-label">⚡ わざゲージ</span>
        <div class="pips" id="gaugePips"></div>
      </div>
      <button class="skill-btn" id="skillBtn"><span class="ic" id="skillBtnIcon">👊</span><span class="nm" id="skillBtnName">なぐる</span></button>
    </div>

    <div class="panel">
      <div class="message" id="message"></div>
      <div id="quizArea">
        <div style="text-align:center"><span class="qtag" id="qtag">よみ</span></div>
        <div class="quiz-main" id="quizMain"></div>
        <div class="quiz-hint" id="quizHint"></div>
        <div class="choices" id="choices"></div>
      </div>
      <button class="btn-primary" id="nextBtn" style="display:none;">つぎへ ▶</button>
    </div>
  </div>

  <!-- ===== RESULT ===== -->
  <div id="screen-result" class="screen">
    <div class="card result-card">
      <div class="emoji" id="resultEmoji">🎉</div>
      <h2 id="resultTitle"></h2>
      <div class="stats" id="resultStats"></div>
      <button class="btn-primary" id="backBtn">タイトルへもどる</button>
    </div>
  </div>

  <!-- ===== SHOP ===== -->
  <div id="screen-shop" class="screen">
    <div class="shop-head">
      <h2>🛒 ショップ</h2>
      <span class="coinhud">🪙 <span id="shopCoins">0</span></span>
    </div>
    <div class="shop-tabs">
      <button class="shop-tab sel" data-tab="avatar">👕 みため</button>
      <button class="shop-tab" data-tab="skill">⚡ わざ</button>
      <button class="shop-tab" data-tab="item">💪 のうりょく</button>
    </div>
    <div class="shop-note" id="shopNote"></div>
    <div class="shop-list" id="shopList"></div>
    <div class="shop-foot">
      <button class="link-btn" id="resetBtn">セーブをリセット</button>
      <button class="btn-primary btn-ghost" id="shopBackBtn" style="width:auto; padding:9px 20px;">もどる</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   漢字データ（ビルド時に自動でうめこみ：小1〜6）
   { k:漢字, on:音読み(カタカナ), kun:訓読み(ひらがな), s:画数 }
   ========================================================= */
const KANJI_DATA = {

   ショップ：アバター / 必殺技 / のうりょくアイテム
   ========================================================= */
const AVATARS = [

  { id:"cat",     name:"ねこせんし",         sprite:"🐱",   cost:100,  atk:0, hp:2, desc:"さいだいHP+2" },
  { id:"ninja",   name:"にんじゃ",           sprite:"🥷",   cost:180,  atk:1, hp:1, desc:"こうげき+1・HP+1" },
  { id:"mage",    name:"まほうつかい",       sprite:"🧙",   cost:280,  atk:1, hp:2, desc:"こうげき+1・HP+2" },
  { id:"fox",     name:"きつねび",           sprite:"🦊",   cost:380,  atk:2, hp:1, desc:"こうげき+2・HP+1" },

const SKILLS = [
  { id:"punch",   name:"なぐる",           icon:"👊", cost:0,    power:2,  anim:"throw",  proj:"💢", burst:"💥", color:"#ffd27a" },
  { id:"fire",    name:"ファイアボール",   icon:"🔥", cost:180,  power:3,  anim:"throw",  proj:"🔥", burst:"💥", color:"#ff7a3c" },
  { id:"ice",     name:"アイスショット",   icon:"❄️", cost:300,  power:4,  anim:"throw",  proj:"❄️", burst:"🧊", color:"#7ec8ff" },
  { id:"thunder", name:"サンダーボルト",   icon:"⚡", cost:480,  power:5,  anim:"strike", proj:"⚡", burst:"⚡", color:"#ffe14d" },
  { id:"wind",    name:"カマイタチ",       icon:"🌀", cost:650,  power:6,  anim:"throw",  proj:"🌀", burst:"💨", color:"#a8e6cf" },

  { id:"dragon",  name:"ドラゴンブレス",   icon:"🐉", cost:1700, power:12, anim:"throw",  proj:"🐉", burst:"🔥", color:"#b06bff" },
];
const SHOP_ITEMS = [
  { id:"hp",     name:"いのちのうつわ",       icon:"❤️", base:80,  growth:60,  max:10, desc:"さいだいHP+1" },
  { id:"atk",    name:"ちからのおまもり",     icon:"⚔️", base:150, growth:120, max:5,  desc:"つうじょう攻撃 +1" },
  { id:"luck",   name:"こううんコイン",       icon:"🍀", base:120, growth:100, max:5,  desc:"せいかいで もらえるコイン +2" },
  { id:"charge", name:"しゅうちゅうハチマキ", icon:"🎯", base:300, growth:300, max:2,  desc:"わざゲージが はやくたまる" },
];

/* =========================================================
   セーブ（localStorage）
   ========================================================= */
const SAVE_KEY = "kanjiQuestSave_v2";
let save = loadSave();
function defaultSave() {
  return { coins:0, owned:["hero"], equipped:"hero", skills:["punch"], skillEquipped:"punch", items:{hp:0,atk:0,luck:0,charge:0} };
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const s = Object.assign(defaultSave(), JSON.parse(raw));
    s.items = Object.assign({hp:0,atk:0,luck:0,charge:0}, s.items||{});
    if (!Array.isArray(s.skills) || !s.skills.length) s.skills = ["punch"];
    if (!s.skillEquipped) s.skillEquipped = "punch";
    return s;
  } catch (e) { return defaultSave(); }
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){} refreshCoinHud(); }
function refreshCoinHud() {
  $("titleCoins").textContent = save.coins;
  $("battleCoins").textContent = save.coins;
  $("shopCoins").textContent = save.coins;
  $("titleAvatar").textContent = getAvatar().sprite;
}
function getAvatar() { return AVATARS.find(a => a.id === save.equipped) || AVATARS[0]; }
function equippedSkill() { return SKILLS.find(s => s.id === save.skillEquipped) || SKILLS[0]; }
function baseMaxHp() { return 6 + (save.items.hp||0) + getAvatar().hp; }
function baseAtk()   { return 1 + (save.items.atk||0) + getAvatar().atk; }
function coinPerHit(){ return 5 + 2*(save.items.luck||0); }
function gaugeMax()  { return Math.max(2, 4 - (save.items.charge||0)); }

/* =========================================================
   ゲームじょうたい
   ========================================================= */
const state = {
  grade:1, mode:"easy", stage:0,
  playerMaxHp:6, playerHp:6, atk:1, gauge:0,
  enemyMaxHp:0, enemyHp:0,
  pool:[], poolIdx:0,
  correct:0, total:0, earned:0, locked:false, skillBusy:false,
};

const $ = id => document.getElementById(id);
const screens = { title:$("screen-title"), battle:$("screen-battle"), result:$("screen-result"), shop:$("screen-shop") };
function show(name){ Object.values(screens).forEach(s=>s.classList.remove("active")); screens[name].classList.add("active"); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* =========================================================
   タイトル
   ========================================================= */
const GRADE_LABELS = {
  1:["1年","にゅうもん"], 2:["2年","やさしい"], 3:["3年","ふつう"],
  4:["4年","ちょいむず"], 5:["5年","むずかしい"], 6:["6年","とてもむず"],
};
function buildGradeButtons() {
  const wrap = $("gradeBtns"); wrap.innerHTML = "";
  for (const g of [1,2,3,4,5,6]) {
    const n = (KANJI_DATA[g]||[]).length;
    const btn = document.createElement("button");
    btn.className = "grade-btn";
    btn.innerHTML = `小学${GRADE_LABELS[g][0]}<small>${n}字</small>`;
    btn.onclick = () => startGame(g);
    wrap.appendChild(btn);
  }
}
document.querySelectorAll("#modeSeg button").forEach(b => {
  b.onclick = () => { document.querySelectorAll("#modeSeg button").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); state.mode = b.dataset.mode; };
});

/* =========================================================
   ゲーム開始
   ========================================================= */
function startGame(grade) {
  state.grade = grade; state.stage = 0;
  state.playerMaxHp = baseMaxHp(); state.playerHp = state.playerMaxHp;
  state.atk = baseAtk(); state.gauge = 0; state.skillBusy = false;
  state.pool = shuffle(KANJI_DATA[grade]); state.poolIdx = 0;
  state.correct = 0; state.total = 0; state.earned = 0;
  $("playerSprite").textContent = getAvatar().sprite;
  $("playerLvl").textContent = "(攻" + state.atk + ")";
  show("battle");
  loadStage();
}
function loadStage() {
  const m = MONSTERS[state.stage];
  state.enemyMaxHp = m.hp; state.enemyHp = m.hp;
  $("enemyName").textContent = m.name;
  $("enemySprite").textContent = m.sprite;
  $("enemySprite").classList.add("pop");
  setTimeout(()=>$("enemySprite").classList.remove("pop"),400);
  $("stageBadge").textContent = `ステージ ${state.stage+1} / ${MONSTERS.length}`;
  updateBars(); updateGauge();
  setMessage(`あ！ やせいの ${m.name} が あらわれた！`);
  setTimeout(nextQuestion, 900);
}
function updateBars() {
  const ep = Math.max(0, state.enemyHp/state.enemyMaxHp)*100;
  const pp = Math.max(0, state.playerHp/state.playerMaxHp)*100;
  const eb=$("enemyHp"), pb=$("playerHp");
  eb.style.width=ep+"%"; pb.style.width=pp+"%";
  eb.style.background=hpColor(ep); pb.style.background=hpColor(pp);
  $("playerHpText").textContent = `HP ${Math.max(0,state.playerHp)}/${state.playerMaxHp}`;
}
function hpColor(p){
  if(p>50) return "linear-gradient(90deg,var(--good1),var(--good2))";
  if(p>20) return "linear-gradient(90deg,#fbbf24,#f59e0b)";
  return "linear-gradient(90deg,#fb7185,#ef4444)";
}
function setMessage(t){ $("message").textContent = t; }
function updateGauge() {
  const max = gaugeMax();
  const pips = $("gaugePips"); pips.innerHTML = "";
  for (let i=0;i<max;i++){ const d=document.createElement("span"); d.className="pip"+(i<state.gauge?" on":""); pips.appendChild(d); }
  const sk = equippedSkill();
  const ready = state.gauge>=max && !state.skillBusy;
  const btn = $("skillBtn");
  $("skillBtnIcon").textContent = sk.icon;
  btn.classList.toggle("ready", ready);
  btn.disabled = !ready;
  $("skillBtnName").textContent = ready ? "わざ！" : sk.name;
}

/* =========================================================
   出題
   ========================================================= */
function nextEntry(){ if(state.poolIdx>=state.pool.length){ state.pool=shuffle(state.pool); state.poolIdx=0; } return state.pool[state.poolIdx++]; }
function distractReadings(field, answer){
  const set=[...new Set(state.pool.map(e=>e[field]).filter(r=>r&&r!==answer))];
  return shuffle(set).slice(0,3);
}
function buildReadingQ(entry, field, hint, tag){
  const answer=entry[field];
  return { tag, prompt:entry.k, hint, answer, options:shuffle([answer,...distractReadings(field,answer)]), mainClass:"" };
}
function buildStrokeQ(entry){
  const answer=entry.s+"画";
  const set=new Set([entry.s]);
  const deltas=shuffle([-3,-2,-1,1,2,3,4]); let i=0;
  while(set.size<4&&i<deltas.length){ const v=entry.s+deltas[i++]; if(v>=1) set.add(v); }
  let extra=entry.s+5; while(set.size<4) set.add(extra++);
  return { tag:"画数（書きじゅん）", prompt:entry.k, hint:"なん画で書くかな？", answer, options:shuffle([...set]).map(n=>n+"画"), mainClass:"" };
}
function buildKanjiQ(entry){
  const reading=entry.kun||entry.on;
  const others=shuffle(state.pool.filter(e=>e.k!==entry.k)).slice(0,3).map(e=>e.k);
  return { tag:"ぎゃくびき", prompt:reading, hint:"この よみの かんじは どれ？", answer:entry.k, options:shuffle([entry.k,...others]), mainClass:"reading" };
}
function makeQuestion(entry){
  if(state.mode==="easy"){
    const field=entry.kun?"kun":"on";
    return buildReadingQ(entry, field, "ただしい よみを えらんでね", "よみ");
  }
  const cands=[];
  if(entry.kun) cands.push("kun");
  if(entry.on)  cands.push("on");
  cands.push("strokes","kanji");
  switch(pickOne(cands)){
    case "kun":     return buildReadingQ(entry,"kun","「くんよみ（日本のよみ方）」はどれ？","訓読み");
    case "on":      return buildReadingQ(entry,"on","「音読み（中国ふうのよみ方）」はどれ？","音読み");
    case "strokes": return buildStrokeQ(entry);
    default:        return buildKanjiQ(entry);
  }
}
function nextQuestion(){
  state.locked=false;
  const q=makeQuestion(nextEntry());
  setMessage("クイズ！ こたえをえらんでね");
  $("qtag").textContent=q.tag;
  $("quizMain").className="quiz-main "+q.mainClass;
  $("quizMain").textContent=q.prompt;
  $("quizHint").textContent=q.hint;
  const box=$("choices"); box.innerHTML="";
  q.options.forEach(opt=>{
    const b=document.createElement("button");
    b.className="choice"; b.textContent=opt;
    b.onclick=()=>answerChosen(b, opt===q.answer, q.answer);
    box.appendChild(b);
  });
  $("quizArea").style.display="block";
  $("nextBtn").style.display="none";
}

function answerChosen(btn, isCorrect, answer){
  if(state.locked) return;
  state.locked=true;
  state.total++;
  document.querySelectorAll(".choice").forEach(c=>{ c.disabled=true; if(c.textContent===answer) c.classList.add("correct"); });

  if(isCorrect){
    state.correct++;
    const gain = coinPerHit();
    addCoins(gain);
    const dmg = state.atk;
    state.gauge = Math.min(gaugeMax(), state.gauge+1);
    state.enemyHp -= dmg;
    attackAnim("enemy");
    floatDamage("enemy", dmg);
    floatCoin(gain);
    setMessage(`せいかい！ ${dmg} のダメージ！💥（🪙+${gain}）`);
    if(state.gauge>=gaugeMax())
      setTimeout(()=>setMessage("⚡ゲージMAX！ 下の「わざ！」ボタンを すきなときに！"), 480);
  } else {
    btn.classList.add("wrong");
    state.playerHp--;
    setMessage(`ざんねん…！ こたえは「${answer}」。 はんげきをうけた！`);
    attackAnim("player");
    floatDamage("player", 1);
  }
  updateBars(); updateGauge();

  setTimeout(()=>{
    if(state.enemyHp<=0){ stageClear(); return; }
    if(state.playerHp<=0){ gameOver(); return; }
    $("quizArea").style.display="none";
    $("nextBtn").style.display="block";
  }, 850);
}
$("nextBtn").onclick = nextQuestion;
function addCoins(n){ save.coins+=n; state.earned+=n; persist(); }

/* ===== 必殺技：自分のタイミングで発動 ===== */
function useSkill(){
  if(state.gauge < gaugeMax() || state.skillBusy) return;
  if(!screens.battle.classList.contains("active")) return;
  if(state.enemyHp <= 0) return;
  const sk = equippedSkill();
  const dmg = state.atk + sk.power;
  state.gauge = 0;
  state.skillBusy = true;
  updateGauge();
  playSkillAnim(sk);
  setMessage(`⚡わざ「${sk.name}」さくれつ！ ${dmg} ダメージ！`);
  setTimeout(()=>floatDamage("enemy", dmg, true), 560);
  state.enemyHp -= dmg;
  updateBars();
  setTimeout(()=>{
    state.skillBusy = false;
    updateBars(); updateGauge();
    if(state.enemyHp <= 0){
      $("quizArea").style.display="none";
      $("nextBtn").style.display="none";
      state.locked = true;
      stageClear();
    }
  }, 1150);
}
$("skillBtn").onclick = useSkill;

/* =========================================================
   アニメーション
   ========================================================= */
function attackAnim(target){
  const sprite = target==="enemy" ? $("enemySprite") : $("playerSprite");
  sprite.classList.add(target==="enemy" ? "shake" : "flash");
  setTimeout(()=>sprite.classList.remove("shake","flash"),400);
}
function floatDamage(target, text, big){
  const d=document.createElement("div");
  d.className="dmg-float"+(big?" big":"");
  d.textContent=text;
  if(target==="enemy"){ d.style.right="44px"; d.style.top="34px"; }
  else { d.style.left="44px"; d.style.bottom="64px"; }
  $("field").appendChild(d);
  setTimeout(()=>d.remove(),1000);
}
function floatCoin(amount){
  const d=document.createElement("div");
  d.className="coin-float"; d.textContent="🪙+"+amount;
  d.style.right="34px"; d.style.top="80px";
  $("field").appendChild(d);
  setTimeout(()=>d.remove(),1100);
}
function playSkillAnim(sk){
  const field=$("field");
  const fl=document.createElement("div");
  fl.className="skill-flash"; fl.style.background=sk.color; fl.style.animation="flashFx .6s forwards";
  field.appendChild(fl); setTimeout(()=>fl.remove(),600);
  const p=document.createElement("div");
  p.className="skill-proj"; p.textContent=sk.proj;
  p.style.animation=(sk.anim==="strike"?"skillStrike":"skillFly")+" .55s forwards";
  field.appendChild(p);
  setTimeout(()=>{
    p.remove();
    const b=document.createElement("div");
    b.className="skill-burst"; b.textContent=sk.burst;
    field.appendChild(b); setTimeout(()=>b.remove(),600);
    const es=$("enemySprite");
    es.classList.add("shake"); setTimeout(()=>es.classList.remove("shake"),450);
  },520);
}

/* =========================================================
   ステージクリア / ゲームオーバー / クリア
   ========================================================= */
function stageClear(){
  const m=MONSTERS[state.stage];
  const bonus=20+state.stage*10;
  addCoins(bonus);
  setMessage(`${m.name} を たおした！ 🎊（🪙+${bonus}）`);
  $("enemySprite").textContent="💨";
  $("quizArea").style.display="none";
  $("nextBtn").style.display="none";
  state.stage++;
  if(state.stage>=MONSTERS.length){ setTimeout(gameClear,1100); }
  else { state.playerHp=Math.min(state.playerMaxHp, state.playerHp+2); updateBars(); setTimeout(loadStage,1300); }
}
function gameOver(){ showResult("💀","ゲームオーバー…",false); }
function gameClear(){ addCoins(150); showResult("👑","ぜんステージ クリア！",true); }
function showResult(emoji,title,win){
  $("resultEmoji").textContent=emoji;
  $("resultTitle").textContent=title;
  const rate=state.total?Math.round(state.correct/state.total*100):0;
  $("resultStats").innerHTML =
    `がくねん：小学${GRADE_LABELS[state.grade][0]}<br>`+
    `たおしたモンスター：${state.stage} / ${MONSTERS.length}<br>`+
    `せいかい：${state.correct} / ${state.total} もん（${rate}％）<br>`+
    `<span class="reward">このゲームで 🪙${state.earned} ゲット！</span>`+
    (win?"<br>🌟 ショップで わざや すがたを そろえよう！":"");
  show("result");
}

/* =========================================================
   ショップ
   ========================================================= */
let shopTab="avatar";
const SHOP_NOTES = {
  avatar:"そうびすると 戦闘中の見た目がかわり、こうげき力やHPもアップ！",
  skill:"わざゲージMAXのとき、戦闘中の「わざ！」ボタンを すきなタイミングで押すと はつどう！",
  item:"買うほど つよくなる。コインは せいかい・撃破でたまるよ。",
};
function openShop(){ setShopTab("avatar"); show("shop"); }
function setShopTab(tab){
  shopTab=tab;
  document.querySelectorAll(".shop-tab").forEach(t=>t.classList.toggle("sel",t.dataset.tab===tab));
  $("shopNote").textContent = SHOP_NOTES[tab] || "";
  renderShop();
}
function renderShop(){
  refreshCoinHud();
  const list=$("shopList"); list.innerHTML="";
  if(shopTab==="avatar") AVATARS.forEach(a=>list.appendChild(renderAvatarRow(a)));
  else if(shopTab==="skill") SKILLS.forEach(s=>list.appendChild(renderSkillRow(s)));
  else SHOP_ITEMS.forEach(it=>list.appendChild(renderItemRow(it)));
}
function ownEquipRow(opts){
  const row=document.createElement("div");
  row.className="shop-item";
  row.innerHTML=`<div class="ic">${opts.icon}</div><div class="info"><div class="nm">${opts.nm}</div><div class="ds">${opts.ds}</div></div>`;
  const btn=document.createElement("button");
  btn.className="buy";
  if(opts.equipped){ btn.textContent="そうび中"; btn.classList.add("equipped"); btn.disabled=true; }
  else if(opts.owned){ btn.textContent="そうび"; btn.classList.add("equip"); btn.onclick=opts.onEquip; }
  else { btn.textContent=`🪙${opts.cost}`; if(save.coins<opts.cost) btn.disabled=true; btn.onclick=opts.onBuy; }
  row.appendChild(btn);
  return row;
}
function renderAvatarRow(a){
  return ownEquipRow({
    icon:a.sprite, nm:a.name, ds:a.desc, cost:a.cost,
    owned:save.owned.includes(a.id), equipped:save.equipped===a.id,
    onBuy:()=>{ if(save.coins<a.cost)return; save.coins-=a.cost; save.owned.push(a.id); save.equipped=a.id; persist(); renderShop(); },
    onEquip:()=>{ save.equipped=a.id; persist(); renderShop(); },
  });
}
function renderSkillRow(s){
  return ownEquipRow({
    icon:s.icon, nm:s.name, ds:`いりょく ${s.power}　${s.id==="punch"?"（きほんわざ）":""}`, cost:s.cost,
    owned:save.skills.includes(s.id), equipped:save.skillEquipped===s.id,
    onBuy:()=>{ if(save.coins<s.cost)return; save.coins-=s.cost; save.skills.push(s.id); save.skillEquipped=s.id; persist(); renderShop(); },
    onEquip:()=>{ save.skillEquipped=s.id; persist(); renderShop(); },
  });
}
function itemPrice(it){ return it.base + it.growth*(save.items[it.id]||0); }
function renderItemRow(it){
  const count=save.items[it.id]||0;
  const price=itemPrice(it);
  const maxed=count>=it.max;
  const row=document.createElement("div");
  row.className="shop-item";
  row.innerHTML=`<div class="ic">${it.icon}</div><div class="info"><div class="nm">${it.name}（Lv${count}/${it.max}）</div><div class="ds">${it.desc}</div></div>`;
  const btn=document.createElement("button");
  btn.className="buy";
  if(maxed){ btn.textContent="MAX"; btn.disabled=true; }
  else { btn.textContent=`🪙${price}`; if(save.coins<price) btn.disabled=true;
    btn.onclick=()=>{ if(save.coins<price||count>=it.max)return; save.coins-=price; save.items[it.id]=count+1; persist(); renderShop(); }; }
  row.appendChild(btn);
  return row;
}

/* =========================================================
   ボタン配線・初期化
   ========================================================= */
$("quitBtn").onclick = () => { if(confirm("タイトルにもどる？")) show("title"); };
$("backBtn").onclick = () => { refreshCoinHud(); show("title"); };
$("toShopBtn").onclick = openShop;
$("shopBackBtn").onclick = () => show("title");
document.querySelectorAll(".shop-tab").forEach(t => t.onclick = () => setShopTab(t.dataset.tab));
$("resetBtn").onclick = () => { if(confirm("コインや買ったものを ぜんぶ消して さいしょから にしますか？")){ save=defaultSave(); persist(); renderShop(); } };

buildGradeButtons();
refreshCoinHud();
</script>
