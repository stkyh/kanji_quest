<!-- design v6: 手書き例語をやさしく/書き順は回答後/同音異義を熟語で区別/変な文を出さない -->
<style>
  :root {
    --ink:#1f2438; --muted:#6b7280;
    --accent1:#7c3aed; --accent2:#ec4899;
    --gold:#fbbf24; --gold2:#f97316;
    --good1:#34d399; --good2:#10b981;
    --bad1:#fb7185; --bad2:#ef4444;
    --card:rgba(255,255,255,.96);
    --grad-primary:linear-gradient(135deg,#7c3aed,#ec4899);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { overscroll-behavior:none; }
  body {
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Segoe UI",system-ui,sans-serif;
    color:var(--ink); min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
    background:
      radial-gradient(1100px 700px at 12% -10%, #5b3aa6 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 10%, #2563eb 0%, transparent 50%),
      radial-gradient(900px 900px at 50% 120%, #db2777 0%, transparent 55%),
      linear-gradient(160deg,#171a3a,#0f1226);
    background-attachment:fixed;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  button { font-family:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .game {
    width:100%; max-width:480px;
    background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.18); border-radius:28px; padding:16px;
    box-shadow:0 30px 70px rgba(5,8,25,.55), inset 0 1px 0 rgba(255,255,255,.25);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  }
  .brand { text-align:center; margin-bottom:12px; }
  h1 { font-size:25px; font-weight:800; letter-spacing:1px;
    background:linear-gradient(90deg,#fde68a,#fca5e7,#a5b4fc);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
  .brand small { color:rgba(255,255,255,.6); font-size:11px; letter-spacing:2px; }

  .coinhud { display:inline-flex; align-items:center; gap:6px; background:rgba(8,10,25,.45); color:var(--gold); font-weight:800; font-size:15px; padding:6px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.14); }
  .badge { background:rgba(8,10,25,.4); color:#fff; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.14); }
  .link-btn { background:none; border:none; color:rgba(255,255,255,.7); font-size:12px; cursor:pointer; text-decoration:underline; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; }

  .screen { display:none; animation:fade .25s ease; }
  .screen.active { display:block; }
  @keyframes fade { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }

  .card { background:var(--card); border-radius:20px; padding:18px; box-shadow:0 12px 30px rgba(8,10,30,.35); border:1px solid rgba(255,255,255,.6); }
  .menu-card { text-align:center; }
  .menu-card p { margin-bottom:6px; font-size:14px; line-height:1.7; color:#374151; }
  .section-title { font-size:12px; font-weight:800; color:var(--muted); margin:16px 0 8px; letter-spacing:.5px; }

  .seg { display:flex; gap:4px; background:#eef0f6; border-radius:14px; padding:4px; }
  .seg button { flex:1; border:none; background:transparent; border-radius:11px; padding:9px 4px; font-size:13px; font-weight:700; color:#6b7280; cursor:pointer; line-height:1.3; transition:.18s; }
  .seg button small { display:block; font-size:9.5px; font-weight:600; opacity:.8; margin-top:2px; }
  .seg button .coinrate { display:block; font-size:9px; font-weight:800; color:#b45309; margin-top:3px; letter-spacing:-.3px; }
  .seg button.sel { background:#fff; color:var(--accent1); box-shadow:0 4px 12px rgba(124,58,237,.18); }

  .grade-btns { display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; }
  .grade-btn { background:#fff; border:1.5px solid #e7e8f0; border-radius:16px; padding:12px 4px; font-size:15px; font-weight:800; color:var(--ink); cursor:pointer; transition:.16s; box-shadow:0 3px 10px rgba(8,10,30,.07); }
  .grade-btn:active { transform:scale(.94); }
  .grade-btn:hover { border-color:var(--accent2); box-shadow:0 8px 18px rgba(236,72,153,.22); transform:translateY(-2px); }
  .grade-btn small { display:block; font-size:10px; font-weight:600; color:var(--muted); margin-top:3px; }

  .btn-primary { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:none; border-radius:16px; padding:15px; font-size:16px; font-weight:800; color:#fff; cursor:pointer; background:var(--grad-primary); box-shadow:0 10px 24px rgba(124,58,237,.35); transition:.16s; }
  .btn-primary:active { transform:scale(.97); }
  .btn-gold { background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#3a2400; box-shadow:0 10px 24px rgba(249,115,22,.32); }
  .btn-ghost { background:#fff; color:var(--accent1); border:1.5px solid #e7e8f0; box-shadow:none; }
  .mt { margin-top:16px; }

  .field {
    position:relative; height:216px; overflow:hidden; margin-bottom:10px;
    border-radius:20px; border:1px solid rgba(255,255,255,.5);
    background:
      radial-gradient(120% 80% at 50% 120%, rgba(0,0,0,.12), transparent 60%),
      linear-gradient(#cdeafe 0%, #bfe3ff 56%, #93d68a 56%, #79c46e 100%);
    box-shadow:inset 0 2px 14px rgba(255,255,255,.5), 0 12px 30px rgba(8,10,30,.35);
  }
  .field-bg { position:absolute; inset:0; z-index:0; }
  .field-bg svg { width:100%; height:100%; display:block; }
  .field::after { content:""; position:absolute; inset:0; z-index:1; background:radial-gradient(120% 90% at 50% 30%, transparent 55%, rgba(10,12,40,.18)); pointer-events:none; }
  .sprite-wrap { position:absolute; display:flex; flex-direction:column; align-items:center; z-index:2; }
  .enemy-wrap { top:18px; right:26px; }
  .player-wrap { bottom:14px; left:22px; }
  .sprite-glow { position:absolute; top:46%; left:50%; transform:translate(-50%,-50%); width:108px; height:108px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 68%); }
  .player-wrap .sprite-glow { width:96px; height:96px; }
  .enemy-sprite { font-size:78px; line-height:1; position:relative; z-index:1; filter:drop-shadow(0 8px 7px rgba(0,0,0,.32)); animation:bob 2.6s ease-in-out infinite; }
  .enemy-sprite svg { width:96px; height:96px; display:block; }
  .enemy-sprite.vanish { animation:vanishGo .6s forwards !important; }
  @keyframes vanishGo { 0%{transform:scale(1);opacity:1} 30%{transform:scale(1.15) rotate(3deg)} 100%{transform:scale(.25) translateY(14px) rotate(-8deg);opacity:0;filter:blur(2px)} }
  .player-sprite { width:92px; height:92px; display:grid; place-items:center; position:relative; z-index:1; filter:drop-shadow(0 7px 6px rgba(0,0,0,.3)); animation:bob 2.6s ease-in-out infinite .4s; }
  .player-sprite svg { width:90px; height:90px; }
  .ground-shadow { width:64px; height:13px; border-radius:50%; background:rgba(10,20,10,.28); filter:blur(4px); margin-top:-2px; }
  .player-wrap .ground-shadow { width:56px; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  .nameplate { position:absolute; z-index:3; background:rgba(255,255,255,.92); border-radius:13px; padding:7px 11px; min-width:148px; box-shadow:0 6px 16px rgba(8,10,30,.25); border:1px solid rgba(255,255,255,.7); }
  .nameplate.enemy { top:14px; left:14px; }
  .nameplate.player { bottom:14px; right:14px; }
  .nameplate .name { font-size:13px; font-weight:800; }
  .nameplate .lv { font-size:10px; color:var(--muted); font-weight:600; }
  .hpbar-bg { background:#e5e7ef; border-radius:999px; height:9px; margin-top:5px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.15); }
  .hpbar { height:100%; width:100%; border-radius:999px; background:linear-gradient(90deg,var(--good1),var(--good2)); transition:width .45s cubic-bezier(.4,1.2,.5,1), background .4s; }
  .hp-text { font-size:10px; text-align:right; color:var(--muted); font-weight:700; margin-top:1px; }

  .combo-badge { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:4; background:linear-gradient(135deg,#f97316,#ef4444); color:#fff; font-weight:900; font-size:14px; padding:4px 12px; border-radius:999px; box-shadow:0 4px 12px rgba(239,68,68,.4); display:none; }
  .combo-badge.show { display:block; animation:comboPop .3s; }
  @keyframes comboPop { 0%{transform:translateX(-50%) scale(.5)} 60%{transform:translateX(-50%) scale(1.25)} 100%{transform:translateX(-50%) scale(1)} }

  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translate(-9px,2px) rotate(-4deg)} 60%{transform:translate(9px,-2px) rotate(4deg)} }
  .shake { animation:shake .32s !important; }
  @keyframes flash { 0%,100%{opacity:1} 50%{opacity:.25} }
  .flash { animation:flash .3s 2 !important; }
  @keyframes pop { 0%{transform:scale(0)} 60%{transform:scale(1.25)} 100%{transform:scale(1)} }
  .pop { animation:pop .4s !important; }

  .dmg-float { position:absolute; font-weight:900; font-size:28px; color:#fff; text-shadow:0 2px 0 #b91c1c, 0 0 10px rgba(255,0,80,.6); pointer-events:none; animation:floatUp 1s forwards; z-index:7; }
  .dmg-float.big { font-size:46px; text-shadow:0 3px 0 #be123c, 0 0 16px rgba(255,0,90,.85); }
  .dmg-float.foe { color:#ffd0d0; text-shadow:0 2px 0 #7f1d1d, 0 0 10px rgba(255,40,40,.7); }
  .dmg-float.poison { color:#d8b4fe; text-shadow:0 2px 0 #6b21a8; font-size:22px; }
  .coin-float { position:absolute; font-weight:800; font-size:19px; color:var(--gold); text-shadow:0 2px 4px rgba(0,0,0,.5); pointer-events:none; animation:floatUp 1.1s forwards; z-index:7; }
  @keyframes floatUp { 0%{opacity:1; transform:translateY(0) scale(.8)} 25%{transform:translateY(-6px) scale(1.1)} 100%{opacity:0; transform:translateY(-46px) scale(1)} }

  .skill-flash,.hurt-flash { position:absolute; inset:0; z-index:4; opacity:0; pointer-events:none; }
  .skill-flash { mix-blend-mode:screen; }
  .hurt-flash { background:radial-gradient(circle, rgba(255,0,0,0), rgba(220,0,0,.4)); animation:flashFx .35s forwards; }
  @keyframes flashFx { 0%{opacity:0} 30%{opacity:.6} 100%{opacity:0} }
  .crit-flash { position:absolute; inset:0; z-index:5; background:radial-gradient(circle, rgba(255,255,255,.6), transparent 60%); animation:flashFx .35s forwards; pointer-events:none; }
  .skill-proj { position:absolute; font-size:44px; z-index:5; filter:drop-shadow(0 0 10px rgba(255,255,255,.9)); }
  @keyframes skillFly { 0%{left:46px; top:150px; transform:scale(.6) rotate(0)} 100%{left:330px; top:44px; transform:scale(1.5) rotate(360deg)} }
  @keyframes skillStrike { 0%{left:330px; top:-48px; transform:scale(.6); opacity:0} 35%{opacity:1} 100%{left:340px; top:42px; transform:scale(1.7); opacity:1} }
  .foe-proj { position:absolute; font-size:38px; z-index:5; filter:drop-shadow(0 0 7px rgba(255,80,80,.85)); }
  @keyframes foeFly { 0%{left:320px; top:54px; transform:scale(.6)} 100%{left:60px; top:150px; transform:scale(1.25)} }
  .skill-burst { position:absolute; left:312px; top:14px; font-size:66px; z-index:6; animation:burstPop .6s forwards; }
  @keyframes burstPop { 0%{transform:scale(0); opacity:1} 55%{transform:scale(1.7)} 100%{transform:scale(2.3); opacity:0} }

  .skillbar { display:flex; align-items:center; gap:10px; background:rgba(8,10,25,.4); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:8px 12px; margin-bottom:10px; }
  .gauge-wrap { display:flex; flex-direction:column; gap:4px; }
  .gauge-label { font-size:10px; font-weight:700; color:rgba(255,255,255,.7); }
  .pips { display:flex; gap:5px; }
  .pip { width:15px; height:15px; border-radius:50%; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25); transition:.2s; }
  .pip.on { background:linear-gradient(135deg,var(--gold),var(--gold2)); border-color:transparent; box-shadow:0 0 9px rgba(251,191,36,.85); }
  .skill-btn { margin-left:auto; display:flex; align-items:center; gap:7px; border:none; border-radius:13px; padding:10px 14px; font-size:14px; font-weight:800; cursor:pointer; color:rgba(255,255,255,.55); background:rgba(255,255,255,.1); transition:.18s; max-width:62%; }
  .skill-btn .ic { font-size:18px; }
  .skill-btn .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .skill-btn:disabled { cursor:default; }
  .skill-btn.ready { color:#3a2400; background:linear-gradient(135deg,var(--gold),var(--gold2)); animation:pulse 1.25s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(251,191,36,.55)} 70%{box-shadow:0 0 0 12px rgba(251,191,36,0)} 100%{box-shadow:0 0 0 0 rgba(251,191,36,0)} }

  .panel { background:var(--card); border-radius:20px; padding:16px; min-height:186px; box-shadow:0 12px 30px rgba(8,10,30,.35); border:1px solid rgba(255,255,255,.6); }
  .timer { height:7px; background:#e5e7ef; border-radius:999px; overflow:hidden; margin-bottom:10px; box-shadow:inset 0 1px 2px rgba(0,0,0,.12); }
  .timer > div { height:100%; width:100%; border-radius:999px; background:linear-gradient(90deg,#34d399,#10b981); transition:width .1s linear, background .3s; }
  .message { font-size:14.5px; line-height:1.5; min-height:21px; margin-bottom:8px; color:#374151; font-weight:600; }
  .qtag { display:inline-block; font-size:11px; font-weight:800; color:#fff; background:var(--grad-primary); border-radius:999px; padding:3px 12px; margin-bottom:2px; }
  .quiz-main { font-size:54px; text-align:center; font-weight:800; margin:4px 0 6px; letter-spacing:4px; color:var(--ink); }
  .quiz-main.reading { font-size:32px; letter-spacing:1px; }
  .quiz-hint { font-size:13px; text-align:center; color:var(--muted); margin-bottom:12px; }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .choice { background:#fff; border:1.5px solid #e7e8f0; border-radius:14px; padding:14px 6px; font-size:18px; font-weight:800; color:var(--ink); cursor:pointer; transition:.14s; box-shadow:0 3px 9px rgba(8,10,30,.07); }
  .choice:active:not(:disabled) { transform:scale(.96); }
  .choice:hover:not(:disabled) { border-color:var(--accent2); transform:translateY(-2px); }
  .choice:disabled { cursor:default; }
  .choice.correct { background:linear-gradient(135deg,var(--good1),var(--good2)); color:#fff; border-color:transparent; box-shadow:0 8px 18px rgba(16,185,129,.35); }
  .choice.wrong { background:linear-gradient(135deg,var(--bad1),var(--bad2)); color:#fff; border-color:transparent; box-shadow:0 8px 18px rgba(239,68,68,.35); }
  .choice.kids { font-size:34px; padding:22px 6px; }
  .seg button[data-mode="kids"].sel { color:#db2777; }

  /* ===== 手書きパッド ===== */
  .write-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .pad { width:100%; height:190px; background:#fff; border:2px dashed #cbd5e1; border-radius:16px; touch-action:none; box-shadow:inset 0 2px 10px rgba(0,0,0,.05); cursor:crosshair; }
  .write-controls { display:flex; gap:10px; width:100%; }
  .write-controls button { flex:1; border:none; border-radius:13px; padding:13px; font-weight:800; font-size:15px; cursor:pointer; }
  .wc-clear { background:#eef0f6; color:#6b7280; }
  .wc-submit { background:var(--grad-primary); color:#fff; box-shadow:0 8px 18px rgba(124,58,237,.3); }
  .wc-submit:disabled { opacity:.55; }
  .recog-info { font-size:13px; color:var(--muted); min-height:20px; text-align:center; font-weight:600; }
  .recog-info b { color:var(--ink); font-size:18px; }
  .fallback-btns { display:flex; gap:8px; justify-content:center; margin-top:6px; }
  .fallback-btns button { border:none; border-radius:11px; padding:9px 18px; font-weight:800; cursor:pointer; color:#fff; }
  .fb-ok { background:linear-gradient(135deg,var(--good1),var(--good2)); }
  .fb-ng { background:linear-gradient(135deg,var(--bad1),var(--bad2)); }

  .result-card { text-align:center; }
  .result-card .emoji { font-size:66px; filter:drop-shadow(0 8px 10px rgba(0,0,0,.2)); }
  .result-card h2 { margin:8px 0; font-size:22px; }
  .result-card .stats { font-size:14px; line-height:1.9; margin:12px 0; color:#374151; }
  .reward { color:#b45309; font-weight:800; }

  .shop-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .shop-head h2 { color:#fff; font-size:19px; }
  .shop-tabs { display:flex; gap:6px; margin-bottom:10px; background:rgba(8,10,25,.35); border-radius:14px; padding:4px; }
  .shop-tab { flex:1; background:transparent; border:none; border-radius:11px; padding:9px 4px; font-weight:800; cursor:pointer; font-size:13px; color:rgba(255,255,255,.7); transition:.16s; }
  .shop-tab.sel { background:#fff; color:var(--accent1); box-shadow:0 4px 12px rgba(0,0,0,.2); }
  .shop-note { font-size:11.5px; color:rgba(255,255,255,.75); margin-bottom:10px; line-height:1.5; }
  .shop-list { display:flex; flex-direction:column; gap:9px; max-height:50vh; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:2px; }
  .shop-item { background:var(--card); border-radius:15px; padding:11px; display:flex; align-items:center; gap:11px; box-shadow:0 6px 16px rgba(8,10,30,.22); border:1px solid rgba(255,255,255,.6); }
  .shop-item .ic { font-size:32px; line-height:1; width:50px; height:50px; display:grid; place-items:center; border-radius:13px; background:linear-gradient(135deg,#f3f4ff,#fde9f5); flex:none; }
  .shop-item .info { flex:1; min-width:0; }
  .shop-item .info .nm { font-weight:800; font-size:15px; }
  .shop-item .info .ds { font-size:12px; color:var(--muted); }
  .stars { color:#f59e0b; font-size:11px; letter-spacing:1px; }
  .shop-item .buy { border:none; border-radius:11px; padding:9px 12px; font-weight:800; cursor:pointer; font-size:13px; min-width:84px; color:#3a2400; background:linear-gradient(135deg,var(--gold),var(--gold2)); box-shadow:0 5px 12px rgba(249,115,22,.3); flex:none; }
  .shop-item .buy:disabled { background:#e5e7ef; color:#9aa0ad; box-shadow:none; cursor:default; }
  .shop-item .buy.equip { background:linear-gradient(135deg,#60a5fa,#3b82f6); color:#fff; box-shadow:0 5px 12px rgba(59,130,246,.3); }
  .shop-item .buy.equipped { background:linear-gradient(135deg,var(--good1),var(--good2)); color:#fff; }
  .shop-foot { display:flex; justify-content:space-between; align-items:center; margin-top:14px; }

  .medallion { position:relative; width:52px; height:52px; border-radius:50%; display:grid; place-items:center; overflow:hidden; flex:none;
    background:radial-gradient(circle at 50% 30%, #ffffff, #e9ecf8);
    box-shadow:0 4px 10px rgba(8,10,30,.22), inset 0 0 0 3px var(--rar,#cbd5e1); }
  .medallion svg { width:46px; height:46px; }
  .medallion.sm { width:34px; height:34px; box-shadow:0 2px 6px rgba(0,0,0,.25), inset 0 0 0 2px var(--rar,#cbd5e1); } .medallion.sm svg { width:30px; height:30px; }
  .rar-common { --rar:#b6c0d0; } .rar-uncommon { --rar:#22c55e; } .rar-rare { --rar:#3b82f6; } .rar-epic { --rar:#a855f7; }
  .rar-epic { box-shadow:0 0 11px rgba(168,85,247,.45), inset 0 0 0 3px #a855f7; }
  .rar-legend { --rar:#f59e0b; box-shadow:0 0 16px rgba(245,158,11,.6), inset 0 0 0 3px #f59e0b; }
  .stars.r-uncommon{color:#22c55e}.stars.r-rare{color:#3b82f6}.stars.r-epic{color:#a855f7}.stars.r-legend{color:#f59e0b}

  /* 書き順ボタン */

  /* 書き順モーダル */

function shade(hex, pct){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255; const f=pct/100;
  r=Math.round(r+(pct<0?r*f:(255-r)*f)); g=Math.round(g+(pct<0?g*f:(255-g)*f)); b=Math.round(b+(pct<0?b*f:(255-b)*f));
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function loadSave(){

    s.items=Object.assign({hp:0,atk:0,luck:0,charge:0}, s.items||{});

/* コインは 学年・モード・ステージ・周回数 が上がるほど たくさん もらえる */
function coinPerHit(){
  const base = 5;
  const gradeMul = state.mode==="kids" ? 1 : (1 + (state.grade-1)*0.4);   // 1.0〜3.0
  const modeMul  = state.mode==="hard"?1.6 : state.mode==="write"?1.8 : state.mode==="kids"?0.7 : 1;
  const stageMul = 1 + state.stage*0.2;                                   // 後半ほど増える
  const clearMul = 1 + (save.clears||0)*0.3;                              // 周回ごとに増える
  const luckMul  = 1 + 0.25*(save.items.luck||0);                         // こううんコイン：1レベルで+25%（最大×3）
  return Math.max(1, Math.round(base * gradeMul * modeMul * stageMul * clearMul * luckMul));
}

function nextEntry(){ if(state.poolIdx>=state.pool.length){ state.pool=shuffle(state.pool); state.poolIdx=0; } return state.pool[state.poolIdx++]; }
function distractReadings(field,answer){ const set=[...new Set(state.pool.map(e=>e[field]).filter(r=>r&&r!==answer))]; return shuffle(set).slice(0,3); }
function buildReadingQ(entry,field,hint,tag){ const answer=entry[field]; return { tag, prompt:entry.k, hint, answer, options:shuffle([answer,...distractReadings(field,answer)]), mainClass:"" }; }
function buildStrokeQ(entry){
  const answer=entry.s+"画"; const set=new Set([entry.s]); const deltas=shuffle([-3,-2,-1,1,2,3,4]); let i=0;
  while(set.size<4&&i<deltas.length){ const v=entry.s+deltas[i++]; if(v>=1) set.add(v); }
  let extra=entry.s+5; while(set.size<4) set.add(extra++);
  return { tag:"画数（書きじゅん）", prompt:entry.k, hint:"なん画で書くかな？", answer, options:shuffle([...set]).map(n=>n+"画"), mainClass:"" };
}
function buildKanjiQ(entry){
  const reading=entry.kun||entry.on;
  const others=shuffle(state.pool.filter(e=>e.k!==entry.k)).slice(0,3).map(e=>e.k);
  return { tag:"ぎゃくびき", prompt:reading, hint:"この よみの かんじは どれ？", answer:entry.k, options:shuffle([entry.k,...others]), mainClass:"reading" };
}
function makeQuestion(entry){
  if(state.mode==="easy"){ const field=entry.kun?"kun":"on"; return buildReadingQ(entry,field,"ただしい よみを えらんでね","よみ"); }
  const cands=[]; if(entry.kun)cands.push("kun"); if(entry.on)cands.push("on"); cands.push("strokes","kanji");
  switch(pickOne(cands)){
    case "kun": return buildReadingQ(entry,"kun","「くんよみ（日本のよみ方）」はどれ？","訓読み");
    case "on": return buildReadingQ(entry,"on","「音読み（中国ふうのよみ方）」はどれ？","音読み");
    case "strokes": return buildStrokeQ(entry);
    default: return buildKanjiQ(entry);
  }
}
function nextQuestion(){
  if(state.poison>0){
    state.poison--; state.playerHp-=1;
    floatDamage("player","☠1",false,"poison"); hurtFlash(); attackAnim("player"); updateBars();
    if(state.playerHp<=0){ gameOver(); return; }

  state.locked=false;

  $("quizArea").style.display="block"; $("nextBtn").style.display="none"; $("afterOrderBtn").style.display="none";
  if(state.mode==="kids"){ renderKidsQuestion(entry); return; }
  if(state.mode==="write"){ renderWriteQuestion(entry); return; }
  const q=makeQuestion(entry); state.curAnswer=q.answer;
  setMessage("クイズ！ こたえをえらんでね");
  $("qtag").textContent=q.tag; $("quizMain").className="quiz-main "+q.mainClass; $("quizMain").textContent=q.prompt; $("quizHint").textContent=q.hint;
  $("writeArea").style.display="none";
  const box=$("choices"); box.style.display="grid"; box.innerHTML="";
  q.options.forEach(opt=>{ const b=document.createElement("button"); b.className="choice"; b.textContent=opt; b.onclick=()=>answerChosen(b,opt===q.answer,q.answer); box.appendChild(b); });
  startTimer();
}
function renderWriteQuestion(entry){
  state.curAnswer=entry.k;
  $("qtag").textContent="✏️てがき"; $("quizMain").className="quiz-main reading";
  const blanked = entry.ew ? entry.ew.split(entry.k).join("▢") : "";
  if(entry.ew && entry.er && blanked!==entry.ew){
    setMessage("ことばの ▢（しかく）に 入る かんじを かこう！（▢の かんじ だけ）");
    $("quizMain").textContent = makeSentence(blanked, entry);
    $("quizHint").textContent = `よみ：${entry.er}`;
  } else {

/* かならず正しい日本語になるものだけ文にする。それ以外は「ことばの穴埋め」だけ表示 */
function makeSentence(cloze, entry){
  const oku = entry.ew && entry.ew.length>=2 && [...entry.ew].slice(1).every(c=>/[ぁ-んァ-ヶー]/.test(c)) && entry.ew[0]===entry.k;
  // い形容詞（〜い）だけ「とても〜。」、動詞（送りがな付き）だけ「〜。」
  if(oku && entry.p==="a" && entry.ew.endsWith("い")) return `とても ${cloze}。`;
  if(oku && entry.p==="v") return `${cloze}。`;
  // 名詞・じゅくご・その他は、ことばのまま（穴埋め）。へんな文を作らない
  return cloze;
}

/* ===== 解答 共通処理 ===== */
function finishCorrect(){
  state.correct++; state.combo++; state.maxCombo=Math.max(state.maxCombo,state.combo);
  const crit = state.combo%5===0;
  const gain = coinPerHit()+(crit?10:0); addCoins(gain);
  const dmg = state.atk*(crit?3:1); state.enemyHp-=dmg;
  state.gauge=Math.min(gaugeMax(),state.gauge+1);
  attackAnim("enemy"); floatDamage("enemy",dmg,crit); if(crit)critFlash(); floatCoin(gain);
  impactEnemy(crit);
  SFX.correct(); setTimeout(()=>{ crit?SFX.crit():SFX.hit(); },170); setTimeout(()=>SFX.coin(),320);
  setMessage(crit?`⭐クリティカル！ ${dmg} ダメージ！（🪙+${gain}）`:`せいかい！ ${dmg} ダメージ！💥（🪙+${gain}）`);
  if(state.gauge>=gaugeMax()) setTimeout(()=>setMessage("⚡ゲージMAX！「わざ！」ボタンを すきなときに！"),520);
  updateBars(); updateGauge(); updateCombo();
  setTimeout(()=>{
    if(state.enemyHp<=0){ stageClear(); return; }
    if(Math.random()<enemyChance()){ enemyAttack(()=>setTimeout(proceedNext,260)); } else proceedNext();
  },820);
}
function finishWrong(msg){
  state.combo=0; updateCombo(); setMessage(msg); SFX.wrong();
  setTimeout(()=>enemyAttack(()=>setTimeout(proceedNext,260)),480);
}
function answerChosen(btn, isCorrect, answer){
  if(state.locked) return;
  state.locked=true; stopTimer(); state.total++;

  if(isCorrect) finishCorrect(); else { btn.classList.add("wrong"); finishWrong(`ざんねん…！ こたえは「${answer}」`); }
}
function onTimeout(){
  if(state.locked) return;

/* ===== 手書き認識 ===== */
let pad={canvas:null,ctx:null,strokes:[],cur:null,drawing:false,dpr:1};
function initPad(){
  const c=$("padCanvas"); if(!c) return;
  pad.canvas=c; pad.ctx=c.getContext("2d");
  const down=e=>{ if(state.locked&&state.mode==="write"&&!$("submitWriteBtn").disabled){} pad.drawing=true; pad.cur={x:[],y:[]}; addPt(e); e.preventDefault(); };
  const move=e=>{ if(!pad.drawing) return; addPt(e); drawPad(); e.preventDefault(); };
  const up=e=>{ if(!pad.drawing) return; pad.drawing=false; if(pad.cur&&pad.cur.x.length) pad.strokes.push(pad.cur); pad.cur=null; };
  c.addEventListener("pointerdown",down);
  c.addEventListener("pointermove",move);
  window.addEventListener("pointerup",up);
  c.addEventListener("pointercancel",up);
}
function ptFromEvent(e){ const r=pad.canvas.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
function addPt(e){ if(!pad.cur)return; const p=ptFromEvent(e); pad.cur.x.push(Math.round(p.x)); pad.cur.y.push(Math.round(p.y)); }
function resizePad(){ const c=pad.canvas; if(!c) return; const w=c.clientWidth||300, h=c.clientHeight||190; pad.dpr=window.devicePixelRatio||1; c.width=w*pad.dpr; c.height=h*pad.dpr; pad.ctx.setTransform(pad.dpr,0,0,pad.dpr,0,0); drawPad(); }
function drawGuide(){ const ctx=pad.ctx, w=pad.canvas.clientWidth, h=pad.canvas.clientHeight; ctx.clearRect(0,0,w,h); ctx.save(); ctx.strokeStyle="#e2e8f0"; ctx.setLineDash([6,7]); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(w/2,8); ctx.lineTo(w/2,h-8); ctx.moveTo(8,h/2); ctx.lineTo(w-8,h/2); ctx.stroke(); ctx.restore(); }
function drawPad(){ if(!pad.ctx) return; drawGuide(); const ctx=pad.ctx; ctx.strokeStyle="#1f2438"; ctx.lineWidth=7; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.setLineDash([]); const draw=s=>{ ctx.beginPath(); for(let i=0;i<s.x.length;i++){ if(i===0)ctx.moveTo(s.x[i],s.y[i]); else ctx.lineTo(s.x[i],s.y[i]); } if(s.x.length===1)ctx.lineTo(s.x[0]+0.1,s.y[0]+0.1); ctx.stroke(); }; pad.strokes.forEach(draw); if(pad.cur)draw(pad.cur); }
function clearPad(){ pad.strokes=[]; pad.cur=null; drawPad(); }
async function recognizeKanji(){
  const w=Math.round(pad.canvas.clientWidth), h=Math.round(pad.canvas.clientHeight);
  const ink=pad.strokes.map(s=>[s.x,s.y]);
  const body={options:"enable_pre_space",requests:[{writing_guide:{writing_area_width:w,writing_area_height:h},ink:ink,language:"ja"}]};
  const res=await fetch("https://inputtools.google.com/request?itc=ja-t-i0-handwrit&app=mobilesearch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await res.json();
  if(data[0]==="SUCCESS"&&data[1]&&data[1][0]&&data[1][0][1]) return data[1][0][1];
  return [];
}
async function submitWrite(){
  if(state.locked) return;
  if(pad.strokes.length===0){ $("recogInfo").innerHTML="✏️ なにか かいてね"; return; }
  state.locked=true; $("submitWriteBtn").disabled=true; $("recogInfo").innerHTML="にんしき ちゅう…⏳";

/* ===== 書き順アニメ（KanjiVG） ===== */
const strokeCache = {};
async function fetchStrokes(kanji){
  if(strokeCache[kanji]) return strokeCache[kanji];
  const cp = kanji.codePointAt(0).toString(16).padStart(5,'0');
  const url = `https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${cp}.svg`;
  const res = await fetch(url);
  const txt = await res.text();
  const ds = (txt.match(/ d="[^"]*"/g)||[]).map(s=>s.slice(4,-1));
  strokeCache[kanji] = ds;
  return ds;
}
let strokeTimers = [];
function clearStrokeTimers(){ strokeTimers.forEach(t=>clearTimeout(t)); strokeTimers=[]; }
async function showStroke(kanji){
  const modal=$("strokeModal"), stage=$("strokeStage");
  state.curStrokeKanji = kanji;
  $("strokeTitle").innerHTML = `✍️ 「<b>${kanji}</b>」の 書きじゅん`;
  stage.innerHTML = "<div style='color:#9aa0ad;font-weight:700'>よみこみ中…</div>";
  modal.classList.add("show");
  let ds;
  try{ ds = await fetchStrokes(kanji); }catch(e){ ds=null; }
  if(!ds || !ds.length){ stage.innerHTML = "<div style='color:#9aa0ad;font-weight:700'>書き順データが ありません</div>"; return; }
  playStroke(ds);
}
function playStroke(ds){
  clearStrokeTimers();
  const stage=$("strokeStage");
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox","0 0 109 109");
  // うすい お手本（全画）
  ds.forEach(d=>{ const g=document.createElementNS(NS,"path"); g.setAttribute("d",d); g.setAttribute("class","ghost"); g.setAttribute("fill","none"); g.setAttribute("stroke-width","3.5"); g.setAttribute("stroke-linecap","round"); g.setAttribute("stroke-linejoin","round"); svg.appendChild(g); });
  const inks=[];
  ds.forEach(d=>{ const p=document.createElementNS(NS,"path"); p.setAttribute("d",d); p.setAttribute("class","ink"); p.setAttribute("fill","none"); p.setAttribute("stroke-width","4.5"); p.setAttribute("stroke-linecap","round"); p.setAttribute("stroke-linejoin","round"); svg.appendChild(p); inks.push(p); });
  stage.innerHTML=""; stage.appendChild(svg);
  const per=520;
  inks.forEach((p,i)=>{
    const len=p.getTotalLength();
    p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
    strokeTimers.push(setTimeout(()=>{ p.style.transition=`stroke-dashoffset ${per}ms linear`; p.style.strokeDashoffset="0"; }, i*per+200));
  });
}
$("strokeReplay").onclick = ()=>{ const ds=strokeCache[state.curStrokeKanji]; if(ds) playStroke(ds); };

/* ===== 効果音（WebAudio：音声ファイル不要で生成） ===== */
const SFX = (() => {
  let ctx=null;
  function ac(){ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(ctx.state==="suspended") ctx.resume(); return ctx; }
  function tone(freq,start,dur,type,gain,glideTo){
    const c=ac(); if(!c) return; const t0=c.currentTime+start;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(freq,t0);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(gain||0.18,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+0.03);
  }
  function noise(start,dur,gain,freq,ftype){
    const c=ac(); if(!c) return; const t0=c.currentTime+start;
    const len=Math.max(1,Math.floor(c.sampleRate*dur));
    const buf=c.createBuffer(1,len,c.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=c.createBufferSource(); src.buffer=buf;
    const g=c.createGain(); g.gain.setValueAtTime(gain||0.2,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    let node=src;
    if(freq){ const f=c.createBiquadFilter(); f.type=ftype||"lowpass"; f.frequency.value=freq; src.connect(f); node=f; }
    node.connect(g).connect(c.destination); src.start(t0); src.stop(t0+dur+0.03);
  }
  return {
    resume:ac,
    select:()=>tone(520,0,0.05,"square",0.09,720),
    correct:()=>{ tone(659,0,0.09,"sine",0.15); tone(880,0.07,0.10,"sine",0.15); tone(1318,0.15,0.13,"sine",0.11); },
    wrong:()=>{ tone(196,0,0.2,"square",0.14,120); tone(130,0.05,0.22,"square",0.11,90); },

    win:()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,i*0.12,0.2,"triangle",0.17)); tone(1568,0.48,0.45,"triangle",0.14); },
    lose:()=>{ [392,330,262,196].forEach((f,i)=>tone(f,i*0.16,0.32,"sine",0.15)); },
    skill:(type)=>{ switch(type){
      case "fire":    tone(110,0,0.32,"sawtooth",0.14,440); noise(0.04,0.34,0.2,900,"lowpass"); break;
      case "ice":     tone(1400,0,0.18,"triangle",0.12,2300); tone(1900,0.07,0.22,"sine",0.09,2700); noise(0,0.12,0.07,4200,"highpass"); break;
      case "thunder": noise(0,0.05,0.22,3200,"highpass"); noise(0.09,0.05,0.2,3200,"highpass"); noise(0.18,0.06,0.18,3000,"highpass"); tone(70,0,0.32,"sawtooth",0.1,38); break;
      case "wind":    noise(0,0.32,0.16,1200,"bandpass"); tone(620,0,0.3,"sine",0.07,1700); break;
      case "star":    [880,1175,1568,2093].forEach((f,i)=>tone(f,i*0.05,0.13,"triangle",0.1)); break;
      case "holy":    tone(784,0,0.34,"sine",0.1); tone(988,0,0.34,"sine",0.09); tone(1319,0.06,0.32,"sine",0.08); noise(0.02,0.2,0.05,5000,"highpass"); break;
      case "cosmic":  tone(55,0,0.42,"sine",0.13,420); [1568,2093,2637].forEach((f,i)=>tone(f,0.08+i*0.05,0.16,"triangle",0.09)); break;
      default:        noise(0,0.12,0.13,2200,"highpass"); tone(300,0,0.16,"sawtooth",0.1,900);

/* ===== ビジュアルエフェクト（パーティクル・斬撃・衝撃波・閃光・画面シェイク） ===== */
function spriteCenter(el){ const f=$("field").getBoundingClientRect(); const r=el.getBoundingClientRect(); return { x:r.left-f.left+r.width/2, y:r.top-f.top+r.height/2 }; }
function spawnParticles(x,y,opts){
  opts=opts||{}; const field=$("field");
  const count=opts.count||12, colors=opts.colors||["#ffffff"], spread=opts.spread||64, size=opts.size||6, dur=opts.dur||600, rise=opts.rise||0;
  for(let i=0;i<count;i++){
    const p=document.createElement("div"); p.className="particle";
    const ang=Math.random()*Math.PI*2, dist=spread*(0.4+Math.random()*0.7);
    const s=(size*(0.6+Math.random()*0.9)).toFixed(1);

  }
}

function shockwave(x,y,gold){ const d=document.createElement("div"); d.className="shockwave"+(gold?" ring2":""); d.style.left=x+"px"; d.style.top=y+"px"; $("field").appendChild(d); setTimeout(()=>d.remove(),520); }
function bigFlash(){ const d=document.createElement("div"); d.className="bigflash"; $("field").appendChild(d); setTimeout(()=>d.remove(),420); }
function shakeField(big){ const f=$("field"); const cls=big?"shaking-lg":"shaking"; f.classList.remove("shaking","shaking-lg"); void f.offsetWidth; f.classList.add(cls); setTimeout(()=>f.classList.remove(cls),600); }
function impactEnemy(crit){
  const c=spriteCenter($("enemySprite"));
  slashAt(c.x,c.y); shockwave(c.x,c.y,crit);
  spawnParticles(c.x,c.y,{ count:crit?24:13, colors:crit?["#fff","#ffd166","#ff8c42","#ff5e62"]:["#fff","#ffe9a8","#ffd166"], spread:crit?105:66, size:crit?9:6, rise:6 });
  if(crit) bigFlash();
  shakeField(crit);
}
function launchConfetti(){
  const colors=["#fbbf24","#34d399","#60a5fa","#f472b6","#a855f7","#f97316"];
  for(let i=0;i<70;i++){
    const c=document.createElement("div");
    c.style.cssText=`position:fixed;top:-14px;left:${Math.random()*100}vw;width:${6+Math.random()*7}px;height:${9+Math.random()*9}px;background:${colors[i%colors.length]};z-index:99;border-radius:2px;pointer-events:none;`;
    c.style.animation=`confFall ${1.7+Math.random()*1.7}s ${Math.random()*0.5}s linear forwards`;
    document.body.appendChild(c); setTimeout(()=>c.remove(),4200);
  }
}

/* ===== アニメ ===== */
function attackAnim(target){ const s=target==="enemy"?$("enemySprite"):$("playerSprite"); s.classList.add(target==="enemy"?"shake":"flash"); setTimeout(()=>s.classList.remove("shake","flash"),400); }
function floatDamage(target,text,big,extra){
  const d=document.createElement("div"); d.className="dmg-float"+(big?" big":"")+(extra?" "+extra:""); d.textContent=text;
  if(target==="enemy"){ d.style.right="44px"; d.style.top="34px"; } else { d.style.left="46px"; d.style.bottom="66px"; }
  $("field").appendChild(d); setTimeout(()=>d.remove(),1000);
}
function floatCoin(amount){ const d=document.createElement("div"); d.className="coin-float"; d.textContent="🪙+"+amount; d.style.right="34px"; d.style.top="82px"; $("field").appendChild(d); setTimeout(()=>d.remove(),1100); }
function hurtFlash(){ const d=document.createElement("div"); d.className="hurt-flash"; $("field").appendChild(d); setTimeout(()=>d.remove(),360); }
function critFlash(){ const d=document.createElement("div"); d.className="crit-flash"; $("field").appendChild(d); setTimeout(()=>d.remove(),360); }
function playSkillAnim(sk){
  const field=$("field");
  SFX.skill(sk.sfx);
  // チャージのひかり（プレイヤー足元）
  const ch=document.createElement("div"); ch.className="skill-charge"; ch.style.setProperty("--cc",sk.color); field.appendChild(ch); setTimeout(()=>ch.remove(),460);
  // 画面全体のいろフラッシュ
  const fl=document.createElement("div"); fl.className="skill-flash"; fl.style.background=sk.color; fl.style.animation="flashFx .6s forwards"; field.appendChild(fl); setTimeout(()=>fl.remove(),600);
  // 弾（トレイルつき）
  const p=document.createElement("div"); p.className="skill-proj trail"; p.textContent=sk.proj; p.style.setProperty("--cc",sk.color); p.style.animation=(sk.anim==="strike"?"skillStrike":"skillFly")+" .55s forwards"; field.appendChild(p);
  setTimeout(()=>{
    p.remove();
    const c=spriteCenter($("enemySprite"));
    const b=document.createElement("div"); b.className="skill-burst"; b.textContent=sk.burst; field.appendChild(b); setTimeout(()=>b.remove(),600);
    bigFlash(); shockwave(c.x,c.y,true); shockwave(c.x,c.y);
    spawnParticles(c.x,c.y,{ count:30, colors:["#fff","#ffd166",sk.color], spread:130, size:10, rise:10 });
    shakeField(true); SFX.skillHit(sk.sfx);
    const es=$("enemySprite"); es.classList.add("shake"); setTimeout(()=>es.classList.remove("shake"),450);
  },520);
}

/* ===== クリア/オーバー ===== */
function stageClear(){
  stopTimer();
  const m=state.stages[state.stage];
  const bonus=Math.round((20+state.stage*14) * (1+(state.grade-1)*0.3) * (1+(save.clears||0)*0.3)); addCoins(bonus);
  const ec=spriteCenter($("enemySprite"));
  spawnParticles(ec.x,ec.y,{ count:26, colors:["#fff","#ffd166","#a855f7","#60a5fa"], spread:120, size:9, rise:14, dur:800 });
  shockwave(ec.x,ec.y,true); SFX.defeat(); setTimeout(()=>SFX.coin(),200);
  setMessage(`${m.name} を たおした！ 🎊（🪙+${bonus}）`);
  $("enemySprite").classList.add("vanish"); $("quizArea").style.display="none"; $("nextBtn").style.display="none"; $("afterOrderBtn").style.display="none"; $("timerWrap").style.visibility="hidden";
  state.combo=0; updateCombo(); state.stage++;
  if(state.stage>=state.stages.length){ setTimeout(gameClear,1100); }
  else { state.playerHp=Math.min(state.playerMaxHp, state.playerHp+2); updateBars(); setTimeout(loadStage,1300); }
}
function gameOver(){ stopTimer(); SFX.lose(); showResult("💀","ゲームオーバー…",false); }
function gameClear(){
  const firstBoss = !save.bossDefeated;
  const secretRun = state.stages.length>MONSTERS.length;
  save.clears=(save.clears||0)+1;
  save.bossDefeated=true;
  if(secretRun) save.secretDefeated=true;
  addCoins(secretRun?400:150); persist();
  SFX.win(); launchConfetti();
  if(secretRun) showResult("🐲","裏ボス げきは！！",true,{secret:true});
  else showResult("👑","ぜんステージ クリア！",true,{firstBoss});
}
function showResult(emoji,title,win,opts){
  opts=opts||{};
  $("resultEmoji").textContent=emoji; $("resultTitle").textContent=title;
  const rate=state.total?Math.round(state.correct/state.total*100):0;
  const gradeLabel = state.mode==="kids" ? "ようじモード" : ("小学"+GRADE_LABELS[state.grade][0]);
  let extra="";
  if(opts.firstBoss) extra = `<br>🔓 <b>裏ボス「やみのりゅうおう」かいきん！</b><br>つぎの ぼうけんで ちょうせんできる！`;
  else if(opts.secret) extra = `<br>🏆 <b>裏ボスを たおした！「やみのおうじゃ」が ショップに！</b>`;
  else if(win) extra = `<br>🌟 ショップで キャラや わざを そろえよう！`;
  $("resultStats").innerHTML =
    `がくねん：${gradeLabel}<br>`+
    `たおしたモンスター：${state.stage} / ${state.stages.length}<br>`+
    `せいかい：${state.correct} / ${state.total} もん（${rate}％）<br>`+
    `さいだいコンボ：${state.maxCombo} 🔥<br>`+
    `しゅうかい：${save.clears||0} かいめ<br>`+
    `<span class="reward">このゲームで 🪙${state.earned} ゲット！</span>`+
    extra;
  show("result");
}

/* ===== ショップ ===== */
let shopTab="avatar";
const SHOP_NOTES = {
  avatar:"そうびすると 戦闘中の見た目がかわり、こうげき力やHPもアップ！ レアなキャラほど つよい✨",
  skill:"わざゲージMAXのとき、戦闘中の「わざ！」ボタンを すきなタイミングで押すと はつどう！",
  item:"買うほど つよくなる。コインは せいかい・コンボ・撃破でたまるよ。",
};
function openShop(){ setShopTab("avatar"); show("shop"); }
function setShopTab(tab){ shopTab=tab; document.querySelectorAll(".shop-tab").forEach(t=>t.classList.toggle("sel",t.dataset.tab===tab)); $("shopNote").textContent=SHOP_NOTES[tab]||""; renderShop(); }
function renderShop(){
  refreshCoinHud(); const list=$("shopList"); list.innerHTML="";
  if(shopTab==="avatar") AVATARS.forEach(a=>list.appendChild(renderAvatarRow(a)));
  else if(shopTab==="skill") SKILLS.forEach(s=>list.appendChild(renderSkillRow(s)));
  else SHOP_ITEMS.forEach(it=>list.appendChild(renderItemRow(it)));
}
function rowEl(iconHTML, nm, ds){ const row=document.createElement("div"); row.className="shop-item"; row.innerHTML=`${iconHTML}<div class="info"><div class="nm">${nm}</div><div class="ds">${ds}</div></div>`; return row; }
function buyBtn(opts){
  const btn=document.createElement("button"); btn.className="buy";
  if(opts.equipped){ btn.textContent="そうび中"; btn.classList.add("equipped"); btn.disabled=true; }
  else if(opts.owned){ btn.textContent="そうび"; btn.classList.add("equip"); btn.onclick=opts.onEquip; }
  else { btn.textContent=`🪙${opts.cost}`; if(save.coins<opts.cost) btn.disabled=true; btn.onclick=opts.onBuy; }
  return btn;
}
function renderAvatarRow(a){
  const ds=`<span class="stars r-${a.rar}">${RAR_STARS[a.rar]}</span> ${RAR_LABEL[a.rar]}・${a.desc}`;
  const row=rowEl(medallionHTML(a.id), a.name, ds);
  if(a.secret && !save.secretDefeated && !save.owned.includes(a.id)){
    const b=document.createElement("button"); b.className="buy"; b.disabled=true; b.textContent="🔒裏ボス"; row.appendChild(b); return row;
  }
  row.appendChild(buyBtn({ owned:save.owned.includes(a.id), equipped:save.equipped===a.id, cost:a.cost,
    onBuy:()=>{ if(save.coins<a.cost)return; save.coins-=a.cost; save.owned.push(a.id); save.equipped=a.id; persist(); renderShop(); },
    onEquip:()=>{ save.equipped=a.id; persist(); renderShop(); } }));
  return row;
}
function renderSkillRow(s){
  const row=rowEl(`<div class="ic">${s.icon}</div>`, s.name, `いりょく ${s.power}　${s.id==="punch"?"（きほんわざ）":""}`);
  row.appendChild(buyBtn({ owned:save.skills.includes(s.id), equipped:save.skillEquipped===s.id, cost:s.cost,
    onBuy:()=>{ if(save.coins<s.cost)return; save.coins-=s.cost; save.skills.push(s.id); save.skillEquipped=s.id; persist(); renderShop(); },
    onEquip:()=>{ save.skillEquipped=s.id; persist(); renderShop(); } }));
  return row;
}
function itemPrice(it){ return it.base + it.growth*(save.items[it.id]||0); }
function renderItemRow(it){
  const count=save.items[it.id]||0, price=itemPrice(it), maxed=count>=it.max;
  const row=rowEl(`<div class="ic">${it.icon}</div>`, `${it.name}（Lv${count}/${it.max}）`, it.desc);
  const btn=document.createElement("button"); btn.className="buy";
  if(maxed){ btn.textContent="MAX"; btn.disabled=true; }
  else { btn.textContent=`🪙${price}`; if(save.coins<price) btn.disabled=true; btn.onclick=()=>{ if(save.coins<price||count>=it.max)return; save.coins-=price; save.items[it.id]=count+1; persist(); renderShop(); }; }
  row.appendChild(btn); return row;
}

/* ===== 配線・初期化 ===== */
$("quitBtn").onclick = () => { if(confirm("タイトルにもどる？")){ stopTimer(); show("title"); } };
$("backBtn").onclick = () => { refreshCoinHud(); show("title"); };
$("toShopBtn").onclick = openShop;
$("shopBackBtn").onclick = () => show("title");
document.querySelectorAll(".shop-tab").forEach(t => t.onclick = () => setShopTab(t.dataset.tab));
$("resetBtn").onclick = () => { if(confirm("コインや買ったものを ぜんぶ消して さいしょから にしますか？")){ save=defaultSave(); persist(); renderShop(); } };
window.addEventListener("resize", ()=>{ if(state.mode==="write" && screens.battle.classList.contains("active")) resizePad(); });

buildGradeButtons();
refreshCoinHud();
initPad();
</script>
